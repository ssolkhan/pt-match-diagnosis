// ==================== DSLOG PARSER ====================
function parseDSLog(buffer) {
  const view = new DataView(buffer);
  const version = view.getInt32(0);
  
  if (version !== 3 && version !== 4) {
    throw new Error(`Unsupported dslog version: ${version}. Expected 3 or 4.`);
  }

  // Header: 4 bytes version + 8 bytes seconds + 8 bytes fractional
  const secHi = view.getInt32(4);
  const secLo = view.getUint32(8);
  const seconds = secHi * 4294967296 + secLo;
  const fracHi = view.getUint32(12);
  const fracLo = view.getUint32(16);

  const startTime = new Date(LV_EPOCH.getTime() + seconds * 1000);
  
  const headerSize = 20;
  const recordSize = version === 4 ? 47 : 35;
  const dataLen = buffer.byteLength - headerSize;
  const numRecords = Math.floor(dataLen / recordSize);
  
  const records = [];
  for (let i = 0; i < numRecords; i++) {
    const offset = headerSize + i * recordSize;
    const tripTime = view.getUint8(offset) / 2.0;
    const packetLossRaw = view.getUint8(offset + 1);
    const packetLoss = packetLossRaw > 25 ? null : 0.04 * packetLossRaw; // fraction 0.0-1.0; raw 0-25 = 0-100%, anything above is sentinel/invalid
    const voltageRaw = view.getUint16(offset + 2);
    const voltage = voltageRaw === 0xFFFF ? null : voltageRaw / 256.0;
    const rioCpu = 0.01 * view.getUint8(offset + 4) / 2.0;
    const statusByte = view.getUint8(offset + 5);
    const canUsageRaw = view.getUint8(offset + 6);
    const canUsage = canUsageRaw === 0xFF ? null : 0.01 * canUsageRaw / 2.0;
    const wifiDb = view.getUint8(offset + 7) / 2.0;
    const bandwidth = view.getUint16(offset + 8) / 256.0;

    // Status bits (inverted)
    const robotDisabled = !(statusByte & 0x01);
    const robotAuto    = !(statusByte & 0x02);
    const robotTele    = !(statusByte & 0x04);
    const dsDisabled   = !(statusByte & 0x08);
    const dsAuto       = !(statusByte & 0x10);
    const dsTele       = !(statusByte & 0x20);
    const watchdog     = !(statusByte & 0x40);
    const brownout     = !(statusByte & 0x80);

    let mode = 'disconnected';
    if (robotAuto) mode = 'auto';
    else if (robotTele) mode = 'teleop';
    else if (robotDisabled) mode = 'disabled';

    // Parse PDP/PDH per-channel currents
    let totalCurrent = 0;
    const pdpChannels = new Float32Array(24);
    const pdpBase = offset + 10;
    const pdpType = version === 4 ? view.getUint8(pdpBase + 3) : 0; // 25=CTRE PDP, 33=REV PDH, 0=none
    if (pdpType > 0) {
      const pdpDataStart = version === 4 ? pdpBase + 4 : pdpBase;
      const pdpBytes = new Uint8Array(buffer, pdpDataStart, version === 4 ? 33 : 25);

      // Little-endian 10-bit extraction
      function getLE10bit(bytes, bitOffset) {
        const byteIdx = Math.floor(bitOffset / 8);
        const bitPos = bitOffset % 8;
        if (byteIdx + 2 >= bytes.length) return 0;
        const raw = bytes[byteIdx] | (bytes[byteIdx+1] << 8) | (bytes[byteIdx+2] << 16);
        return ((raw >> bitPos) & 0x3FF) / 8.0;
      }

      let channelBitOffsets;
      if (pdpType === 33) {
        // REV PDH: 24 channels, skip first byte (0x1E header)
        // 4 groups of 6 channels per 8-byte (64-bit) block
        // Each group: [ch0:10][ch1:10][ch2:10][pad:2] [ch3:10][ch4:10][ch5:10][pad:2]
        const pdpPayload = pdpBytes.slice(1); // skip 0x1E header byte
        channelBitOffsets = [];
        for (let g = 0; g < 4; g++) {
          const base = g * 64;
          // First half: 3 channels × 10 bits + 2-bit pad = 32 bits
          channelBitOffsets.push(base + 0);   // ch0
          channelBitOffsets.push(base + 10);  // ch1
          channelBitOffsets.push(base + 20);  // ch2
          // Second half: 3 channels × 10 bits + 2-bit pad = 32 bits
          channelBitOffsets.push(base + 32);  // ch3
          channelBitOffsets.push(base + 42);  // ch4
          channelBitOffsets.push(base + 52);  // ch5
        }
        for (let ch = 0; ch < 24; ch++) {
          pdpChannels[ch] = getLE10bit(pdpPayload, channelBitOffsets[ch]);
          totalCurrent += pdpChannels[ch];
        }
      } else {
        // CTRE PDP: 16 channels, big-endian 10-bit
        // Original v3 layout: 3 groups of ~6 channels in 64-bit blocks
        channelBitOffsets = [8,18,28,38,48,58, 72,82,92,102,112,122, 136,146,156,166];
        function getBE10bit(bytes, bitOffset) {
          const byteIdx = Math.floor(bitOffset / 8);
          const bitShift = bitOffset % 8;
          if (byteIdx + 1 >= bytes.length) return 0;
          const val = (bytes[byteIdx] << 8 | bytes[byteIdx + 1]) >> (6 - bitShift);
          return (val & 0x3FF) / 8.0;
        }
        for (let ch = 0; ch < channelBitOffsets.length; ch++) {
          const bo = channelBitOffsets[ch];
          if (Math.floor(bo/8) + 1 < pdpBytes.length) {
            pdpChannels[ch] = getBE10bit(pdpBytes, bo);
            totalCurrent += pdpChannels[ch];
          }
        }
      }
    }

    records.push({
      time_s: i * 0.020,
      timestamp: new Date(startTime.getTime() + i * 20),
      tripTime, packetLoss, voltage, rioCpu, canUsage, wifiDb, bandwidth,
      robotDisabled, robotAuto, robotTele, dsDisabled, dsAuto, dsTele,
      watchdog, brownout, mode, totalCurrent, pdpChannels: Array.from(pdpChannels)
    });
  }

  return { version, startTime, records };
}

// ==================== DSEVENTS PARSER ====================
function parseDSEvents(buffer) {
  const view = new DataView(buffer);
  const version = view.getInt32(0);
  
  const events = [];
  let pos = 4;

  // Read start timestamp
  const startSeconds = readLabviewTimestampSeconds(view, pos);
  pos += 16;
  const startTime = new Date(LV_EPOCH.getTime() + startSeconds * 1000);

  // dsevents format: each record = 16-byte LV timestamp + 4-byte message length + message bytes
  while (pos + 20 <= buffer.byteLength) {
    const evSeconds = readLabviewTimestampSeconds(view, pos);
    pos += 16;

    // Read 4-byte message length (big-endian)
    if (pos + 4 > buffer.byteLength) break;
    const msgLen = view.getInt32(pos); pos += 4;
    
    // Sanity check message length
    if (msgLen < 0 || msgLen > buffer.byteLength - pos) break;
    
    const msgBytes = new Uint8Array(buffer, pos, msgLen);
    pos += msgLen;

    const text = new TextDecoder('utf-8', { fatal: false }).decode(msgBytes).trim();
    if (text.length > 0) {
      const timeSinceStart = evSeconds - startSeconds;
      events.push({
        timestamp: new Date(LV_EPOCH.getTime() + evSeconds * 1000),
        time_s: timeSinceStart,
        text: text,
        ...classifyEvent(text)
      });
    }
  }

  // ---- Stack trace merging: fold consecutive "at ..." lines into previous event ----
  for (let i = events.length - 1; i > 0; i--) {
    const line = events[i].text.trim();
    if (/^\s*at\s+/.test(line)) {
      // Find the nearest preceding non-stack event
      let target = i - 1;
      while (target >= 0 && /^\s*at\s+/.test(events[target].text.trim())) {
        target--;
      }
      if (target >= 0) {
        // Append this stack line to the target event's text
        events[target].text += '\n' + line;
        events.splice(i, 1);
      }
    }
  }
  // Re-classify events that gained stack traces (their severity might change)
  for (let i = 0; i < events.length; i++) {
    if (events[i].text.includes('\nat ')) {
      const reclassified = classifyEvent(events[i].text);
      Object.assign(events[i], reclassified);
    }
  }

  return { version, startTime, events };
}

// ==================== EVENT CLASSIFIER ====================
function classifyEvent(text) {
  const lower = text.toLowerCase();

  // ---- NOISE: auto-hidden by default ----
  if (lower.includes('joystick') && (lower.includes('axes') || lower.includes('buttons') || lower.includes('povs')))
    return { severity: 'info', category: 'System', title: 'Joystick Configuration', noise: true };
  // Joystick POV/unplugged warnings — spam every cycle, not actionable in pit
  if (lower.includes('joystick') && (lower.includes('not available') || lower.includes('unplugged')))
    return { severity: 'info', category: 'System', title: 'Joystick Unplugged Warning', noise: true };
  if (lower.includes('reportjoystickunpluggedwarning') || lower.includes('joystickunplugged'))
    return { severity: 'info', category: 'System', title: 'Joystick Unplugged Warning', noise: true };
  if (lower.includes('photon') || lower.includes('limelight') || lower.includes('camera'))
    return { severity: 'info', category: 'Vision', title: 'Vision Status', noise: true };
  if (lower.includes('info roborio') || lower.includes('info robori'))
    return { severity: 'info', category: 'System', title: 'System Status', noise: true };
  if (lower.includes('info rail faults') || lower.includes('rail faults:'))
    return { severity: 'info', category: 'System', title: 'Rail Faults Status', noise: true };
  if (lower.includes('info communications timeout') || (lower.includes('communications timeout:') && lower.includes('brownouts:')))
    return { severity: 'info', category: 'System', title: 'System Status Summary', noise: true };
  if (lower.includes('signal logger started') || lower.includes('signal logger:'))
    return { severity: 'info', category: 'System', title: 'Signal Logger Status', noise: true };
  if (lower.includes('navx') && lower.includes('opening'))
    return { severity: 'info', category: 'Sensor', title: 'NavX Connection Attempt', noise: true };
  if (lower.includes('driver station') && !lower.includes('lost') && !lower.includes('ping'))
    return { severity: 'info', category: 'System', title: 'Driver Station Info', noise: true };
  if (lower.includes('init:') || (lower.includes('init ') && !lower.includes('error')))
    return { severity: 'info', category: 'Code', title: 'Subsystem Init', noise: true };
  if (/^\s*at\s+/.test(text) || /^\s*$/.test(text))
    return { severity: 'info', category: 'Code', title: 'Stack Trace Fragment', noise: true };
  if (/\[(?:SHOOT|INTAKE|ARM|CLIMB|DRIVE|ELEVATOR|WRIST|TURRET|INDEX|FEEDER|AMP)\]/i.test(text))
    return { severity: 'info', category: 'Code', title: 'Robot Telemetry', noise: true };
  // Generic robot debug telemetry (desiredTx=, output=, setpoint=, etc.)
  if (/^(<TagVersion>\d+\s+)?<(time|message)>.*(?:desired|output|setpoint|measured|encoder|position|velocity)\s*[=:]/i.test(text))
    return { severity: 'info', category: 'Code', title: 'Robot Telemetry', noise: true };
  if (lower.includes('nt:') && (lower.includes('connection') || lower.includes('connected') || lower.includes('client')))
    return { severity: 'info', category: 'System', title: 'NetworkTables Connection', noise: true };
  if (lower.includes('commandscheduler loop overrun') || lower.includes('commandscheduler loop time'))
    return { severity: 'info', category: 'Code', title: 'CommandScheduler Overrun', noise: true };
  if (/\w+\.periodic\(\):\s*[\d.]+s/i.test(text))
    return { severity: 'info', category: 'Code', title: 'Subsystem Periodic Timing', noise: true };
  if (lower.includes('smartdashboard.updatevalues'))
    return { severity: 'info', category: 'Code', title: 'SmartDashboard Timing', noise: true };
  if (lower.includes('statuslogger'))
    return { severity: 'info', category: 'System', title: 'Logger Status', noise: true };
  if (lower.includes('robot program start'))
    return { severity: 'info', category: 'Code', title: 'Robot Program Startup', noise: true };
  if (lower.includes('game specific data'))
    return { severity: 'info', category: 'FMS', title: 'Game Specific Data', noise: true };
  if (/\bphoenix\b/.test(lower) && !lower.includes('error') && !lower.includes('fault'))
    return { severity: 'info', category: 'System', title: 'Phoenix Status', noise: true };

  // ---- CRITICAL (true errors only) ----
  // CAN device timeouts — require CAN-specific keywords
  if ((lower.includes('timed out') && (lower.includes('can') || lower.includes('spark') || lower.includes('talon') || lower.includes('period status'))) ||
      (lower.includes('timeout') && lower.includes('hal:') && lower.includes('can')))
    return { severity: 'critical', category: 'CAN', title: extractTitle(text, 'CAN Timeout') };
  if (lower.includes('brownout') && !lower.includes('info ') && !lower.includes('brownouts:'))
    return { severity: 'critical', category: 'Power', title: 'Brownout Detected' };
  if (lower.includes('unhandled exception') || (lower.includes('error at') && !lower.includes('warning at')) || lower.includes('crash'))
    return { severity: 'critical', category: 'Code', title: 'Code Exception' };
  if (lower.includes('watchdog') && !lower.includes('info'))
    return { severity: 'critical', category: 'System', title: 'Watchdog Timeout' };
  // Loop overrun — check both direct text and inside <details> XML
  if ((lower.includes('loop time') && (lower.includes('overrun') || lower.includes('exceeded'))) ||
      (lower.includes('<details>') && lower.includes('loop time of') && lower.includes('overrun')))
    return { severity: 'warning', category: 'Code', title: 'Loop Overrun' };

  // ---- WARNINGS ----
  if (lower.includes('lost communication'))
    return { severity: 'warning', category: 'Comms', title: 'Communication Lost' };
  if (lower.includes('ping') && lower.includes('bad'))
    return { severity: 'warning', category: 'Comms', title: 'Ping Status Change' };
  if (lower.includes('not a spark max') || lower.includes('functionalities may not work'))
    return { severity: 'warning', category: 'CAN', title: 'CAN Device Mismatch' };
  if (/message\s+\S*\s*not found/.test(lower) || lower.includes('stale') || lower.includes('rx too old'))
    return { severity: 'warning', category: 'CAN', title: extractTitle(text, 'CAN Stale Data') };
  if (lower.includes('error') && lower.includes('can') && !lower.includes('warning at'))
    return { severity: 'warning', category: 'CAN', title: extractTitle(text, 'CAN Warning') };
  if (lower.includes('update') && (lower.includes('firmware') || lower.includes('radio')))
    return { severity: 'warning', category: 'System', title: 'Firmware Update Needed' };
  if (lower.includes('low') && lower.includes('disk'))
    return { severity: 'warning', category: 'System', title: 'Low Disk Space' };
  if (lower.includes('reset safe parameters'))
    return { severity: 'warning', category: 'CAN', title: 'CAN Reset Parameters Timeout' };
  // Generic timeout (non-CAN) — after all specific rules
  if (lower.includes('timed out') || lower.includes('timeout'))
    return { severity: 'warning', category: 'System', title: extractTitle(text, 'System Timeout') };
  // Generic "warning" catch-all — but exclude WPILib stack trace lines like "Warning at edu.wpi.first..."
  if (lower.includes('warning') && !lower.includes('warning at edu.wpi'))
    return { severity: 'warning', category: 'Code', title: extractTitle(text, 'Code Warning') };

  // ---- INFO ----
  if (lower.includes('fms connected'))
    return { severity: 'info', category: 'FMS', title: 'FMS Connected' };
  if (lower.includes('code start'))
    return { severity: 'info', category: 'Code', title: 'Robot Code Started' };
  // WPILib warning-level log lines that aren't actionable warnings
  if (lower.includes('warning at edu.wpi'))
    return { severity: 'info', category: 'Code', title: 'WPILib Warning Log', noise: true };

  return { severity: 'info', category: 'Other', title: text.substring(0, 60) };
}

function extractTitle(text, fallback) {
  const detailMatch = text.match(/<details>\s*(.{10,80}?)(?:\s*<|$)/);
  if (detailMatch) return detailMatch[1].trim().substring(0, 80);
  const msgMatch = text.match(/<message>\s*(.{10,80}?)(?:\s*<|$)/);
  if (msgMatch) return msgMatch[1].trim().substring(0, 80);
  return fallback;
}

function formatErrorDetail(text) {
  // Smart excerpt: parse TagVersion XML, stack traces, and raw messages
  let parts = [];
  let rawText = text;

  // Extract <details> fields from TagVersion messages
  const detailsRegex = /<details>\s*([\s\S]*?)(?=\s*<(?:location|stack|TagVersion)|$)/g;
  const locationRegex = /<location>\s*([\s\S]*?)(?=\s*<(?:stack|TagVersion)|$)/g;
  const messageRegex = /<message>\s*([\s\S]*?)(?=\s*<TagVersion|$)/g;

  let details = [], locations = [], messages = [];
  let m;
  while ((m = detailsRegex.exec(text)) !== null) details.push(m[1].trim());
  while ((m = locationRegex.exec(text)) !== null) locations.push(m[1].trim());
  while ((m = messageRegex.exec(text)) !== null) messages.push(m[1].trim());

  // Build formatted output
  let html = '';

  // Show extracted details (the actual error messages)
  const allMessages = [...details, ...messages].filter(d => d.length > 3);
  if (allMessages.length > 0) {
    html += '<div class="error-excerpt">';
    allMessages.forEach(d => {
      html += '<div class="excerpt-line">' + escapeHtml(d) + '</div>';
    });
    html += '</div>';

    // Show locations (file:line references)
    const allLocations = locations.filter(l => l.length > 3 && l.trim() !== '');
    if (allLocations.length > 0) {
      html += '<div class="error-location">';
      allLocations.forEach(l => {
        html += '<div>📍 ' + escapeHtml(l) + '</div>';
      });
      html += '</div>';
    }
  }

  // Handle stack traces: highlight team code lines
  const stackLines = text.split(/\n|<TagVersion>/).filter(l => l.trim().startsWith('at '));
  if (stackLines.length > 0) {
    // Find team code lines (frc.robot.*) vs library lines
    const teamLines = stackLines.filter(l => l.includes('frc.robot'));
    const libLines = stackLines.filter(l => !l.includes('frc.robot'));

    if (teamLines.length > 0) {
      html += '<div class="stack-trace">';
      html += '<div class="stack-label">Your code:</div>';
      teamLines.forEach(l => {
        html += '<div class="stack-team">' + escapeHtml(l.trim()) + '</div>';
      });
      if (libLines.length > 0) {
        html += '<div class="stack-label" style="margin-top:6px;opacity:0.5;">Library (' + libLines.length + ' frames)</div>';
        html += '<div class="stack-lib">' + libLines.slice(0, 2).map(l => escapeHtml(l.trim())).join('<br>') + '</div>';
      }
      html += '</div>';
    }
  }

  // If no structured content found, show first meaningful line
  if (html === '') {
    const firstLine = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 200);
    html = '<div class="error-excerpt"><div class="excerpt-line">' + escapeHtml(firstLine) + '</div></div>';
  }

  // Add "Show Raw" toggle
  html += '<div class="raw-toggle" onclick="event.stopPropagation(); this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'; this.textContent = this.textContent.includes(\'Show\') ? \'▾ Hide Raw\' : \'▸ Show Raw\'">▸ Show Raw</div>';
  html += '<div class="raw-content" style="display:none">' + escapeHtml(text) + '</div>';

  return html;
}

// ==================== DIAGNOSTIC RULE ENGINE ====================
function runDiagnostics(logData, eventData) {
  const diagnostics = { fixNow: [], investigate: [], monitor: [] };
  const records = logData.records;
  const events = eventData.events;

  // Compute aggregates
  const matchRecords = records.filter(r => r.mode === 'auto' || r.mode === 'teleop');
  const autoRecords = records.filter(r => r.mode === 'auto');
  const teleopRecords = records.filter(r => r.mode === 'teleop');
  const validVoltages = matchRecords.filter(r => r.voltage !== null);
  const minVoltage = validVoltages.length ? Math.min(...validVoltages.map(r => r.voltage)) : 99;
  const avgVoltage = validVoltages.length ? validVoltages.reduce((s, r) => s + r.voltage, 0) / validVoltages.length : 0;
  const validPacketLoss = matchRecords.filter(r => r.packetLoss !== null);
  const maxPacketLoss = validPacketLoss.length ? Math.max(...validPacketLoss.map(r => r.packetLoss)) : 0;
  const avgPacketLoss = validPacketLoss.length ? validPacketLoss.reduce((s, r) => s + r.packetLoss, 0) / validPacketLoss.length : 0;
  const maxCan = computeCanPeak(matchRecords);
  const totalDuration = records.length * 0.02;
  const autoDuration = autoRecords.length * 0.02;
  const teleopDuration = teleopRecords.length * 0.02;

  // Find comms stability
  let modeFlips = 0;
  for (let i = 1; i < records.length; i++) {
    if (records[i].mode !== records[i-1].mode) modeFlips++;
  }
  const commsFlickerRate = modeFlips / (totalDuration || 1);

  // Count sub-threshold voltage periods
  let below10Count = 0, below8Count = 0;
  for (const r of matchRecords) {
    if (r.voltage !== null && r.voltage < 10) below10Count++;
    if (r.voltage !== null && r.voltage < 8) below8Count++;
  }
  const below10Duration = below10Count * 0.02;
  const below8Duration = below8Count * 0.02;

  // Voltage drop events (sustained drops > 2V in 200ms)
  const voltageCrashes = [];
  for (let i = 10; i < matchRecords.length; i++) {
    const curr = matchRecords[i].voltage;
    const prev = matchRecords[i-10].voltage;
    if (curr !== null && prev !== null && prev - curr > 2.0) {
      voltageCrashes.push({ time: matchRecords[i].time_s, from: prev, to: curr });
    }
  }

  // Brownout detection
  const brownouts = records.filter(r => r.brownout);

  // Find time to first robot connection
  const firstConnected = records.find(r => r.mode !== 'disconnected' && r.voltage !== null);
  const connDelay = firstConnected ? firstConnected.time_s : totalDuration;

  // Extract specific events
  const canTimeouts = events.filter(e => e.category === 'CAN' && e.title.includes('Timeout'));
  const canMismatches = events
    .map(e => ({ event: e, info: extractCanMismatchInfo(e.text) }))
    .filter(entry => entry.info);
  const commsLost = events.filter(e => e.title.includes('Communication Lost'));
  const firmwareWarnings = events.filter(e => e.title.includes('Firmware'));
  const diskWarnings = events.filter(e => e.title.includes('Disk'));
  const codeExceptions = events.filter(e => e.severity === 'critical' && e.category === 'Code');
  const watchdogEvents = records.filter(r => r.watchdog);
  const navxEvents = events.filter(e => e.category === 'Sensor' && e.title.includes('NavX'));
  const loopOverruns = events.filter(e => e.title.includes('Loop Overrun'));
  const codeStarts = events.filter(e => e.title === 'Robot Code Started');
  const canTimeoutIds = collectCanIdsFromEvents(canTimeouts);
  const canTimeoutDevices = formatCanDeviceList(canTimeoutIds);

  // ---- RULE 1: Severe voltage drops ----
  if (minVoltage < 8.0) {
    const minVTime = validVoltages.reduce((best, r) => r.voltage < best.voltage ? r : best, validVoltages[0]);
    diagnostics.fixNow.push({
      title: '🔋 Critical Voltage Collapse',
      body: `Battery voltage dropped to ${minVoltage.toFixed(1)}V during the match. Below 8V the roboRIO will brown out and reboot, causing total loss of control. This is extremely dangerous.`,
      evidence: `Min voltage: ${minVoltage.toFixed(2)}V at ${minVTime.time_s.toFixed(1)}s | Crashes below 10V: ${voltageCrashes.length} events | Below-10V duration: ${below10Duration.toFixed(1)}s`,
      action: 'SWAP BATTERY immediately. Check for stalled motors, shorted wiring, or mechanism jams drawing excessive current.',
      time_s: minVTime.time_s
    });
  } else if (minVoltage < 10.0) {
    const minVTime2 = validVoltages.reduce((best, r) => r.voltage < best.voltage ? r : best, validVoltages[0]);
    diagnostics.fixNow.push({
      title: '🔋 Severe Voltage Drops',
      body: `Battery voltage dropped to ${minVoltage.toFixed(1)}V during the match. Voltages below 10V cause erratic motor behavior, CAN communication failures, and brownout risk.`,
      evidence: `Min voltage: ${minVoltage.toFixed(2)}V at ${minVTime2.time_s.toFixed(1)}s | Avg: ${avgVoltage.toFixed(2)}V | Crashes: ${voltageCrashes.length} | Below-10V: ${below10Duration.toFixed(1)}s`,
      action: 'SWAP BATTERY. Investigate current draw — check for stalled motors, binding mechanisms, or short circuits in the wiring harness.',
      time_s: minVTime2.time_s
    });
  } else if (minVoltage < 11.0) {
    diagnostics.investigate.push({
      title: '🔋 Moderate Voltage Sag',
      body: `Battery dipped to ${minVoltage.toFixed(1)}V. While not immediately critical, this indicates the battery is working hard. Continued drops will eventually trigger brownouts.`,
      evidence: `Min: ${minVoltage.toFixed(2)}V | Avg: ${avgVoltage.toFixed(2)}V`,
      action: 'Consider swapping to a fresh battery. Monitor for worsening trend across matches.'
    });
  }

  // ---- RULE 2: Brownouts ----
  if (brownouts.length > 0) {
    diagnostics.fixNow.push({
      title: '⚡ Brownout Events Detected',
      body: `The roboRIO flagged ${brownouts.length} brownout condition(s). During brownout, the roboRIO disables motor outputs to protect itself. Your robot went limp during these moments.`,
      evidence: `Brownout records: ${brownouts.length} (${(brownouts.length * 0.02).toFixed(1)}s total)`,
      action: 'Swap battery. Check PDP/PDH breaker connections. Look for mechanisms that stall under load.'
    });
  }

  // ---- RULE 3: CAN device mismatch ----
  if (canMismatches.length > 0) {
    const { canId, mechName, snippet } = canMismatches[0].info;
    const mechLabel = canId !== null
      ? (mechName ? `${mechName} (CAN ID ${canId})` : `CAN ID ${canId}`)
      : 'Unknown CAN Device';
    diagnostics.fixNow.push({
      title: `🔧 CAN Device Mismatch — ${mechLabel}`,
      body: canId !== null
        ? `Code expects one CAN device type on CAN ID ${canId}${mechName ? ' (' + mechName + ')' : ''}, but a different device is there. This means motor control for that mechanism may be unreliable or non-functional.`
        : 'Code expects one CAN device type, but a different device responded. This means motor control for that mechanism may be unreliable or non-functional.',
      evidence: `"${(snippet || '').substring(0, 160)}..."`,
      action: canId !== null
        ? `Verify CAN ID ${canId}${mechName ? ' (' + mechName + ')' : ''} — is it the expected device type? Update the code constructor to match the actual hardware, or fix the CAN ID assignment in the hardware client (REV, CTRE).`
        : 'Verify the reported CAN device type against what the code expects. Update the code constructor to match the actual hardware, or fix the CAN ID assignment in the hardware client.'
    });
  }

  // ---- RULE 4: CAN timeouts ----
  if (canTimeouts.length > 0) {
    diagnostics.fixNow.push({
      time_s: canTimeouts[0]?.time_s || 0,
      title: '🚨 CAN Bus Timeouts',
      body: `${canTimeouts.length} CAN device(s) timed out during initialization or operation.${canTimeoutDevices ? ' Likely affected devices: ' + canTimeoutDevices + '.' : ''} Devices on the CAN bus are not responding, which means motors or sensors connected to them will not work.`,
      evidence: `${canTimeoutDevices ? 'Likely affected CAN IDs: ' + canTimeoutDevices + '\n' : ''}${canTimeouts.slice(0, 3).map(e => e.text.substring(0, 100)).join('\n')}`,
      action: 'Check CAN wiring chain: look for loose/broken connections, verify termination resistor, check device firmware versions. Power cycle all CAN devices.'
    });
  }

  // ---- RULE 5: High CAN utilization ----
  if (maxCan > 0.70) {
    diagnostics.investigate.push({
      title: '📊 High CAN Bus Utilization',
      body: `CAN bus utilization peaked at ${(maxCan * 100).toFixed(0)}%. Above 70%, the bus becomes congested and devices may miss commands or report stale data. This can cause jerky motor behavior.`,
      evidence: `Peak CAN usage: ${(maxCan * 100).toFixed(1)}%`,
      action: 'Reduce CAN bus traffic: lower status frame rates for non-critical devices, reduce unnecessary sensor polling, check for devices sending at default (high) rates.'
    });
  }

  // ---- RULE 6: Comms instability / flicker ----
  if (commsFlickerRate > 2.0) {
    diagnostics.fixNow.push({
      time_s: records.find(r => r.mode === 'disconnected' && r.voltage !== null)?.time_s || 0,
      title: '📡 Severe Communications Instability',
      body: `Robot connection was flickering at ${commsFlickerRate.toFixed(1)} mode changes/second. The DS and robot are rapidly connecting/disconnecting, which causes intermittent loss of control.`,
      evidence: `Mode transitions: ${modeFlips} over ${totalDuration.toFixed(0)}s | Rate: ${commsFlickerRate.toFixed(1)}/s`,
      action: 'Check radio wiring and barrel jack connection. Inspect Ethernet cables to radio and roboRIO. Verify radio is properly powered (12V, not 5V). Check for RF interference from metal structures.'
    });
  } else if (commsFlickerRate > 0.5) {
    diagnostics.investigate.push({
      title: '📡 Communications Flickering',
      body: `Connection was unstable with ${commsFlickerRate.toFixed(1)} mode changes/second. Some packet loss is normal at events, but this level can cause delayed or missed commands.`,
      evidence: `Mode transitions: ${modeFlips} | Avg packet loss: ${(avgPacketLoss * 100).toFixed(1)}% | Max: ${(maxPacketLoss * 100).toFixed(1)}%`,
      action: 'Check all network connections. Ensure radio firmware is up to date. At events, this may be field-side interference — note which field position.'
    });
  }

  // ---- RULE 7: Packet loss ----
  if (maxPacketLoss > 0.05 && commsFlickerRate <= 2.0) {
    diagnostics.investigate.push({
      title: '📦 Elevated Packet Loss',
      body: `Packet loss peaked at ${(maxPacketLoss * 100).toFixed(1)}% during the match. Above 5% you'll notice delayed joystick inputs and choppy robot response.`,
      evidence: `Max loss: ${(maxPacketLoss * 100).toFixed(1)}% | Avg: ${(avgPacketLoss * 100).toFixed(2)}%`,
      action: 'Check radio signal strength. At events, try to note if loss correlates with specific field positions. Ensure radio antennas are unobstructed.'
    });
  }

  // ---- RULE 8: Slow connection to robot ----
  if (connDelay > 30) {
    diagnostics.investigate.push({
      title: '⏱️ Slow Robot Connection',
      body: `It took ${connDelay.toFixed(0)} seconds after DS logging started to establish robot connection. Long connection times eat into your match time and can indicate network or boot issues.`,
      evidence: `Connection delay: ${connDelay.toFixed(1)}s`,
      action: 'Check roboRIO boot time (is the SD card slow?). Verify radio and network configuration. Ensure robot code starts quickly without blocking in constructor.'
    });
  }

  // ---- RULE 9: Short auto ----
  if (autoDuration > 0 && autoDuration < 10) {
    const hasCodeCrash = codeExceptions.length > 0;
    diagnostics.investigate.push({
      title: '🤖 Abnormally Short Autonomous',
      body: `Auto mode only ran for ${autoDuration.toFixed(1)}s out of the expected 15s.${hasCodeCrash ? ' Code exceptions were also detected, suggesting the auto routine may have crashed.' : ' This could indicate a comm drop, an early mode switch, or an auto routine that ended prematurely.'}`,
      evidence: `Auto duration: ${autoDuration.toFixed(1)}s | Code exceptions: ${codeExceptions.length}`,
      action: hasCodeCrash
        ? 'Review auto routine code for null pointer exceptions, uninitialized subsystems, or command scheduling errors. Check the stack trace in the error log.'
        : 'Verify auto routine is configured correctly. Check command scheduling and timeout values.'
    });
  }

  // ---- RULE 10: Firmware update warnings ----
  if (firmwareWarnings.length > 0) {
    diagnostics.investigate.push({
      title: '🔄 Firmware Update Required',
      body: 'The Driver Station flagged outdated firmware. Running old firmware can cause compatibility issues with the current WPILib and device APIs.',
      evidence: firmwareWarnings.map(e => e.text.substring(0, 120)).join('\n'),
      action: 'Update radio firmware using the FRC Radio Configuration Tool. Check CTRE/REV device firmware via Phoenix Tuner X / REV Hardware Client.'
    });
  }

  // ---- RULE 11: Disk space warning ----
  if (diskWarnings.length > 0) {
    diagnostics.investigate.push({
      title: '💾 Low Disk Space on roboRIO',
      body: 'The roboRIO is running low on storage. If it runs out completely, the robot code may fail to start or logging will stop.',
      evidence: diskWarnings.map(e => e.text.substring(0, 120)).join('\n'),
      action: 'Use Tuner X or SSH to delete old log files from the roboRIO. Clear old hoot logs and data logs.'
    });
  }

  // ---- RULE 12: Code exceptions ----
  if (codeExceptions.length > 0) {
    diagnostics.fixNow.push({
      title: '💥 Robot Code Exceptions',
      body: `${codeExceptions.length} code exception(s) detected. Unhandled exceptions can crash subsystems or the entire robot program.`,
      evidence: codeExceptions.slice(0, 2).map(e => e.text.substring(0, 150)).join('\n'),
      action: 'Review the stack trace to identify the failing line of code. Check for null references, array out of bounds, or hardware initialization failures.'
    });
  }

  // ---- RULE 13: Watchdog violations ----
  if (watchdogEvents.length > 10) {
    diagnostics.investigate.push({
      title: '🐕 Watchdog Violations',
      body: `${watchdogEvents.length} watchdog violation(s) detected. The robot code loop is taking too long (>20ms), causing the watchdog to trigger and briefly disable outputs.`,
      evidence: `Watchdog records: ${watchdogEvents.length} (${(watchdogEvents.length * 0.02).toFixed(1)}s)`,
      action: 'Profile your robot code loop. Move slow operations (vision processing, complex path planning) to separate threads. Reduce unnecessary object allocation in periodic functions.'
    });
  }

  // ---- RULE 14: Voltage crash correlated with CAN errors ----
  if (voltageCrashes.length > 0 && canTimeouts.length > 0) {
    // Check if any voltage crash is within 2s of a CAN timeout
    let correlated = false;
    for (const crash of voltageCrashes) {
      for (const timeout of canTimeouts) {
        if (Math.abs(crash.time - timeout.time_s) < 2.0) {
          correlated = true;
          break;
        }
      }
      if (correlated) break;
    }
    if (correlated) {
      diagnostics.fixNow.push({
        title: '🔗 Voltage Crash + CAN Failure Correlation',
        body: 'Voltage drops and CAN timeouts are happening at the same time. This strongly suggests a mechanism is jamming or stalling, drawing enormous current that starves the CAN bus of power.',
        evidence: `Voltage crashes: ${voltageCrashes.length} | CAN timeouts: ${canTimeouts.length} | Events overlap within 2s`,
        action: 'Identify which mechanism was active during the crash. Check for physical binding, jammed game pieces, or motors fighting each other. Implement current limiting in code.'
      });
    }
  }

  // ---- RULE 15: NavX reconnection attempts ----
  if (navxEvents.length > 3) {
    diagnostics.investigate.push({
      title: '🧭 NavX Sensor Reconnecting Repeatedly',
      body: `NavX attempted ${navxEvents.length} USB connection(s). Repeated reconnection attempts indicate a loose USB cable or NavX power issue.`,
      evidence: `NavX connection attempts: ${navxEvents.length}`,
      action: 'Secure the NavX USB cable. Check for intermittent connections. Consider switching to SPI or I2C if USB is unreliable due to vibration.'
    });
  }

  // ---- RULE 16: Multiple code starts ----
  if (codeStarts.length > 1) {
    diagnostics.investigate.push({
      title: '🔁 Robot Code Restarted During Match',
      body: `Robot code started ${codeStarts.length} time(s), indicating the program crashed and restarted. Each restart means several seconds of no robot control.`,
      evidence: `Code start events: ${codeStarts.length}`,
      action: 'Check for unhandled exceptions that crash the main robot program. Review constructor and initialization code for hardware conflicts.'
    });
  }

  // ---- RULE 17: Average voltage too low overall ----
  if (avgVoltage > 0 && avgVoltage < 11.5 && minVoltage >= 10.0) {
    diagnostics.investigate.push({
      title: '🔋 Overall Low Average Voltage',
      body: `Average battery voltage during the match was only ${avgVoltage.toFixed(2)}V. A healthy battery should average above 12V during a match. This battery may be degraded.`,
      evidence: `Avg voltage: ${avgVoltage.toFixed(2)}V | Min: ${minVoltage.toFixed(2)}V`,
      action: 'Run a battery load test. Mark and retire batteries that can\'t maintain >12V under load. Use a battery beak or similar tool between matches.'
    });
  }

  // ---- RULE 18: No match activity detected ----
  if (matchRecords.length === 0) {
    diagnostics.fixNow.push({
      title: '❌ No Match Activity Detected',
      body: 'The log shows no auto or teleop mode was ever enabled. The robot never participated in the match.',
      evidence: `Total duration: ${totalDuration.toFixed(0)}s | All records in disabled/disconnected state`,
      action: 'This usually means the robot never connected to the field. Check radio, Ethernet, and roboRIO connectivity. Verify team number in DS matches the field assignment.'
    });
  }


  // ---- RULE 19: Radio Power Cycle Detected (with Code Start correlation) ----
  const pingEvents = events.filter(e => e.text.includes('Ping Results'));
  let radioPowerCycleTime = null;
  for (let i = 1; i < pingEvents.length; i++) {
    const prev = pingEvents[i-1].text;
    const curr = pingEvents[i].text;
    if (prev.includes('robot radio(.1)-bad') && curr.includes('robot radio(.1)-GOOD') &&
        prev.includes('FMS-GOOD') && curr.includes('FMS-GOOD')) {
      radioPowerCycleTime = pingEvents[i].time_s;
      break;
    }
  }
  // Also check: radio-bad followed by Code Start (indicates full radio reboot)
  if (!radioPowerCycleTime) {
    for (let i = 0; i < pingEvents.length; i++) {
      if (pingEvents[i].text.includes('robot radio(.1)-bad')) {
        const radioDownTime = pingEvents[i].time_s;
        const codeStartAfter = codeStarts.find(cs => cs.time_s > radioDownTime && cs.time_s < radioDownTime + 30);
        if (codeStartAfter) { radioPowerCycleTime = radioDownTime; break; }
      }
    }
  }
  if (radioPowerCycleTime !== null) {
    diagnostics.fixNow.push({
      time_s: radioPowerCycleTime,
      title: '📡 Radio Reboot Detected',
      body: 'The robot radio dropped and recovered (or triggered a code restart). This means the radio lost power momentarily — a critical wiring issue that causes multi-second disconnects mid-match.',
      evidence: `Radio power cycle at ~${radioPowerCycleTime.toFixed(1)}s | Correlated with code restart: ${codeStarts.length > 1 ? 'YES' : 'no'}`,
      action: 'Check VRM/RPM wiring immediately. Ensure you are using a REV Radio Power Module. Verify barrel jack is secure and not intermittent under vibration.'
    });
  }

  // ---- RULE 20: PDP/PDH Sticky Faults ----
  const stickyFaults = events.filter(e =>
    e.text.toLowerCase().includes('sticky fault') ||
    e.text.toLowerCase().includes('hardware fault')
  );
  if (stickyFaults.length > 0) {
    diagnostics.fixNow.push({
      title: '⚡ PDP/PDH Sticky Faults Detected',
      body: `${stickyFaults.length} sticky or hardware fault(s) detected on the Power Distribution Hub. These indicate transient overcurrent events or hardware issues.`,
      evidence: stickyFaults.slice(0, 2).map(e => e.text.substring(0, 120)).join('\n'),
      action: 'Check for transient shorts in wiring. Clear sticky faults in Phoenix Tuner X / REV Hardware Client. Inspect breakers and connections.'
    });
  }

  // ---- RULE 21: Total Current Spike (Trip Hazard) ----
  let currentSpikeCount = 0;
  let maxTotalCurrent = 0;
  let spikeStart = -1;
  for (let i = 0; i < matchRecords.length; i++) {
    const tc = matchRecords[i].totalCurrent || 0;
    if (tc > maxTotalCurrent) maxTotalCurrent = tc;
    if (tc > 120) {
      if (spikeStart < 0) spikeStart = i;
      if ((i - spikeStart) * 0.02 > 2.0) { currentSpikeCount++; spikeStart = -1; }
    } else {
      spikeStart = -1;
    }
  }
  if (currentSpikeCount > 0) {
    diagnostics.fixNow.push({
      title: '🔌 Total Current Spike — Main Breaker Trip Hazard',
      body: `Total current exceeded 120A for more than 2 seconds on ${currentSpikeCount} occasion(s). The 120A main breaker will trip if sustained, causing total robot shutdown.`,
      evidence: `Peak total current: ${maxTotalCurrent.toFixed(1)}A | Sustained spikes (>2s): ${currentSpikeCount}`,
      action: 'Investigate drivetrain gear ratios or stalled mechanisms. Implement software current limiting on high-draw motors. Check for motors fighting each other.'
    });
  }

  // ---- RULE 22: Predictive Battery Health (Internal Resistance) ----
  const { worstResistance, worstResTime, highResCount } = computeBatteryResistanceMetrics(matchRecords);
  if (highResCount > 5 && worstResistance > 0.025) {
    diagnostics.investigate.push({
      time_s: worstResTime,
      title: '🔋 High Battery Internal Resistance',
      body: `During ${highResCount} high-acceleration events (ΔI > 40A), the battery showed internal resistance of up to ${(worstResistance * 1000).toFixed(1)}mΩ (threshold: 25mΩ). A healthy FRC battery should be under 15mΩ. This battery is at risk of brownout under heavy load.`,
      evidence: `Worst R: ${(worstResistance * 1000).toFixed(1)}mΩ at ${worstResTime.toFixed(1)}s | High-R events: ${highResCount}`,
      action: 'Retire this battery from match play. Label as "Practice Only." Run a load test with a Battery Beak to confirm. A healthy battery reads <15mΩ.'
    });
  } else if (worstResistance > 0 && worstResistance <= 0.015 && matchRecords.length > 0) {
    diagnostics.monitor.push({
      title: '✅ Battery Resistance Healthy',
      body: `Measured internal resistance up to ${(worstResistance * 1000).toFixed(1)}mΩ during acceleration events. Well within the healthy range (<15mΩ).`,
      evidence: `Best measured R: ${(worstResistance * 1000).toFixed(1)}mΩ`
    });
  }

  // ---- RULE 23: Code Loop Overrun ----
  const loopOverrunRegex = /Loop time of ([\d.]+)s exceeded/;
  const overrunEvents = events.filter(e => loopOverrunRegex.test(e.text) || e.text.includes('Periodic is taking too long'));
  // Filter to severe overruns (>0.04s = double the 20ms standard)
  const severeOverruns = overrunEvents.filter(e => {
    const m = e.text.match(loopOverrunRegex);
    return m ? parseFloat(m[1]) > 0.04 : true;
  });
  if (severeOverruns.length > 0) {
    const overrunTimes = overrunEvents.map(e => {
      const m = e.text.match(loopOverrunRegex);
      return m ? parseFloat(m[1]) : 0;
    }).filter(t => t > 0);
    const worstOverrun = overrunTimes.length ? Math.max(...overrunTimes) : 0;
    const severity = worstOverrun > 0.1 ? 'fixNow' : 'investigate';
    diagnostics[severity].push({
      time_s: severeOverruns[0]?.time_s || 0,
      title: '⏱️ Code Loop Overrun' + (worstOverrun > 0.1 ? ' — SEVERE' : ''),
      body: `${overrunEvents.length} total overrun(s), ${severeOverruns.length} severe (>40ms).${worstOverrun > 0 ? ` Worst: ${(worstOverrun * 1000).toFixed(0)}ms (${(worstOverrun / 0.02).toFixed(0)}× the 20ms limit).` : ''} Motor outputs and sensor reads are delayed by this amount every cycle.`,
      evidence: severeOverruns.slice(0, 2).map(e => e.text.substring(0, 120)).join('\n'),
      action: 'Optimize code in teleopPeriodic/robotPeriodic. Check for blocking Thread.sleep calls, heavy logging, slow sensor reads. Move vision processing or path planning to separate threads.'
    });
  }

  // ---- RULE 24: High CPU Utilization ----
  const matchCpuValues = matchRecords.map(r => r.rioCpu * 100);
  const avgCpu = matchCpuValues.length ? matchCpuValues.reduce((s,v) => s+v, 0) / matchCpuValues.length : 0;
  const maxCpu = matchCpuValues.length ? Math.max(...matchCpuValues) : 0;
  if (avgCpu > 85 || maxCpu > 95) {
    diagnostics.investigate.push({
      title: '🖥️ High roboRIO CPU Utilization',
      body: `${avgCpu > 85 ? `Average CPU usage was ${avgCpu.toFixed(0)}% (threshold: 85%).` : ''} ${maxCpu > 95 ? `Peak CPU hit ${maxCpu.toFixed(0)}% (threshold: 95%).` : ''} High CPU can cause loop overruns, delayed CAN communications, and erratic behavior.`,
      evidence: `Avg CPU: ${avgCpu.toFixed(1)}% | Peak: ${maxCpu.toFixed(1)}%`,
      action: 'Check for background processes, high-frequency NetworkTables telemetry, or vision processing overhead on the roboRIO. Reduce logging frequency.'
    });
  }

  // ---- RULE 25: Stale CAN Data (frequency-aware) ----
  const staleCanRegex = /CAN: Message ([\d]+) not found/;
  const staleCan = events.filter(e => {
    const l = e.text.toLowerCase();
    return /message\s+\S*\s*not found/.test(l) || l.includes('stale') || l.includes('rx too old');
  });
  const staleCanIds = collectCanIdsFromEvents(staleCan);
  const staleCanDevices = formatCanDeviceList(staleCanIds);
  // Check for burst: >3 occurrences within 1 second windows
  let staleBursts = 0;
  if (staleCan.length > 3) {
    for (let i = 0; i < staleCan.length - 3; i++) {
      const window = staleCan.filter(e => e.time_s >= staleCan[i].time_s && e.time_s < staleCan[i].time_s + 1.0);
      if (window.length > 3) { staleBursts++; i += window.length - 1; }
    }
  }
  if (staleBursts > 0 || staleCan.length > 10) {
    diagnostics.investigate.push({
      time_s: staleCan[0]?.time_s || 0,
      title: '📡 Stale CAN Data — Burst Detected',
      body: `${staleCan.length} stale CAN events with ${staleBursts} burst(s) of >3 events/second.${staleCanDevices ? ' Most affected devices: ' + staleCanDevices + '.' : ''} This means CAN devices are intermittently failing to communicate, causing motors to use stale commands.`,
      evidence: `${staleCanDevices ? 'Likely affected CAN IDs: ' + staleCanDevices + '\n' : ''}${staleCan.slice(0, 2).map(e => e.text.substring(0, 120)).join('\n')}`,
      action: 'Check CAN bus termination resistor and wiring. Ensure device IDs are unique. Update all CAN device firmware to consistent versions. Look for loose CAN connectors.'
    });
  } else if (staleCan.length > 0) {
    diagnostics.investigate.push({
      time_s: staleCan[0]?.time_s || 0,
      title: '📡 Stale CAN Data',
      body: `${staleCan.length} stale CAN data event(s).${staleCanDevices ? ' Likely affected devices: ' + staleCanDevices + '.' : ''} Isolated occurrences — monitor for increase.`,
      evidence: `${staleCanDevices ? 'Likely affected CAN IDs: ' + staleCanDevices + '\n' : ''}${staleCan.slice(0, 2).map(e => e.text.substring(0, 120)).join('\n')}`,
      action: 'Check CAN bus termination and device firmware versions.'
    });
  }

  // ---- RULE 26: Radio Latency Spikes ----
  const highLatencyRecs = matchRecords.filter(r => r.tripTime > 50);
  const highLatencyNotDisconnect = highLatencyRecs.filter(r => r.mode !== 'disconnected');
  if (highLatencyNotDisconnect.length > 50) { // More than 1 second of high latency
    const avgTrip = matchRecords.reduce((s,r) => s + r.tripTime, 0) / (matchRecords.length || 1);
    const maxTrip = Math.max(...matchRecords.map(r => r.tripTime));
    diagnostics.investigate.push({
      title: '📶 Radio Latency Spikes',
      body: `Trip time exceeded 50ms on ${highLatencyNotDisconnect.length} records (${(highLatencyNotDisconnect.length * 0.02).toFixed(1)}s total) without full disconnect. High latency causes delayed joystick inputs and sluggish robot response.`,
      evidence: `Avg trip time: ${avgTrip.toFixed(1)}ms | Peak: ${maxTrip.toFixed(1)}ms | High-latency records: ${highLatencyNotDisconnect.length}`,
      action: 'Check for high-bandwidth camera streams. Reduce MJPEG resolution and FPS. Ensure radio antennas are unobstructed by metal.'
    });
  }



  // ---- RULE 27: Input-Induced Brownout (Driver Correlation) ----
  // Check if voltage collapses correlate with the start of teleop (aggressive driving)
  if (voltageCrashes.length > 0 && teleopRecords.length > 0) {
    const teleopStart = teleopRecords[0].time_s;
    const earlyTeleopCrashes = voltageCrashes.filter(vc => vc.time >= teleopStart && vc.time <= teleopStart + 10);
    if (earlyTeleopCrashes.length > 0) {
      diagnostics.investigate.push({
        time_s: earlyTeleopCrashes[0].time,
        title: '🎮 Early Teleop Power Spike',
        body: `${earlyTeleopCrashes.length} voltage crash(es) occurred within the first 10 seconds of teleop. This points to a large load right as teleop began, but the cause could be aggressive acceleration, a drivetrain stall, or another mechanism coming on under load.`,
        evidence: `Crash at ${earlyTeleopCrashes[0].time.toFixed(1)}s: ${earlyTeleopCrashes[0].from.toFixed(1)}V → ${earlyTeleopCrashes[0].to.toFixed(1)}V | Teleop started: ${teleopStart.toFixed(1)}s`,
        action: 'Review what mechanisms became active at teleop start. Check drivetrain acceleration, stalled mechanisms, and current limits before assuming driver input alone caused the spike.'
      });
    }
  }

  // ---- RULE 28: Stationary Packet Loss (RF Interference) ----
  // If packet loss is high but robot isn't moving (no mode activity), it's environmental
  const disabledHighLoss = records.filter(r =>
    r.mode === 'disabled' && r.packetLoss !== null && r.packetLoss > 0.05 && r.voltage !== null
  );
  if (disabledHighLoss.length > 25) { // >0.5s of high loss while disabled
    diagnostics.investigate.push({
      time_s: disabledHighLoss[0].time_s,
      title: '📶 Network Instability While Stationary',
      body: `Packet loss exceeded 5% for ${(disabledHighLoss.length * 0.02).toFixed(1)}s while the robot was disabled/stationary. Since no motors were running, this indicates an environmental RF issue, not a robot-induced problem.`,
      evidence: `High-loss records while disabled: ${disabledHighLoss.length} (${(disabledHighLoss.length * 0.02).toFixed(1)}s) | Peak loss: ${(Math.max(...disabledHighLoss.map(r => r.packetLoss)) * 100).toFixed(1)}%`,
      action: 'Likely RF interference or loose radio power cable. Check radio barrel jack, Ethernet connections, and antenna placement. Note your field position — some spots have worse interference.'
    });
  }

  // ---- RULE 29: Subsystem Power Attribution (Command-based) ----
  // Scan events for command lifecycle strings to identify active subsystems during spikes
  const commandEvents = events.filter(e =>
    e.text.toLowerCase().includes('command:') ||
    e.text.toLowerCase().includes('command init') ||
    e.text.toLowerCase().includes('starting command')
  );
  if (commandEvents.length > 0 && voltageCrashes.length > 0) {
    for (const crash of voltageCrashes.slice(0, 3)) {
      const nearbyCommands = commandEvents.filter(ce =>
        Math.abs(ce.time_s - crash.time) < 2.0
      );
      if (nearbyCommands.length > 0) {
        const cmdNames = nearbyCommands.map(c => {
          const m = c.text.match(/[Cc]ommand[: ]+([\w]+)/);
          return m ? m[1] : c.text.substring(0, 40);
        });
        diagnostics.investigate.push({
          time_s: crash.time,
          title: '⚡ Power Spike Correlated with Command: ' + cmdNames[0],
          body: `A voltage crash (${crash.from.toFixed(1)}V → ${crash.to.toFixed(1)}V) occurred while command "${cmdNames[0]}" was active. This command's mechanism is likely the cause of the overcurrent.`,
          evidence: `Crash at ${crash.time.toFixed(1)}s | Active commands: ${cmdNames.join(', ')}`,
          action: 'Add current limiting to the motors controlled by this command. Check the mechanism for binding or stalling.'
        });
        break; // Only report the first correlated one
      }
    }
  }

  // ---- MONITORING / GREEN ITEMS ----
  if (minVoltage >= 11.5 && brownouts.length === 0) {
    diagnostics.monitor.push({
      title: '✅ Battery Health OK',
      body: `Min voltage stayed above 11.5V (${minVoltage.toFixed(2)}V) with no brownouts. Battery performance is acceptable.`,
      evidence: `Min: ${minVoltage.toFixed(2)}V | Avg: ${avgVoltage.toFixed(2)}V`
    });
  }

  if (maxPacketLoss <= 0.02 && commsFlickerRate < 0.5) {
    diagnostics.monitor.push({
      title: '✅ Communications Stable',
      body: `Packet loss peaked at ${(maxPacketLoss * 100).toFixed(1)}% with stable connection. Network performance is good.`,
      evidence: `Max loss: ${(maxPacketLoss * 100).toFixed(1)}% | Mode changes/s: ${commsFlickerRate.toFixed(2)}`
    });
  }

  if (maxCan <= 0.50) {
    diagnostics.monitor.push({
      title: '✅ CAN Bus Healthy',
      body: `CAN utilization peaked at ${(maxCan * 100).toFixed(0)}%, well within safe limits.`,
      evidence: `Peak: ${(maxCan * 100).toFixed(1)}%`
    });
  }


  // ---- GREEN: Power System Efficiency ----
  const maxVoltageSag = validVoltages.length >= 2 ? Math.max(...validVoltages.map(r => r.voltage)) - Math.min(...validVoltages.map(r => r.voltage)) : 0;
  const avgTotalCurrent = matchRecords.length ? matchRecords.reduce((s,r) => s + (r.totalCurrent || 0), 0) / matchRecords.length : 0;
  if (avgTotalCurrent < 40 && maxVoltageSag < 2.0 && matchRecords.length > 0) {
    diagnostics.monitor.push({
      title: '✅ Power System Efficient',
      body: `Average current draw was ${avgTotalCurrent.toFixed(1)}A with voltage sag under 2.0V. Power system is operating efficiently.`,
      evidence: `Avg current: ${avgTotalCurrent.toFixed(1)}A | Max voltage sag: ${maxVoltageSag.toFixed(2)}V`
    });
  }

  // ---- GREEN: Processor Headroom ----
  if (maxCpu < 60 && matchRecords.length > 0) {
    diagnostics.monitor.push({
      title: '✅ Processor Headroom Good',
      body: `Peak CPU usage stayed below 60% (${maxCpu.toFixed(0)}%). Plenty of headroom for additional processing.`,
      evidence: `Peak CPU: ${maxCpu.toFixed(1)}% | Avg: ${avgCpu.toFixed(1)}%`
    });
  }

  // ---- GREEN: Radio Link Quality ----
  const avgTripTime = matchRecords.length ? matchRecords.reduce((s,r) => s + r.tripTime, 0) / matchRecords.length : 999;
  const highLossRecords = matchRecords.filter(r => r.packetLoss !== null && r.packetLoss > 0.01);
  if (avgTripTime < 10 && highLossRecords.length === 0 && matchRecords.length > 0) {
    diagnostics.monitor.push({
      title: '✅ Radio Link Quality Excellent',
      body: `Average trip time was ${avgTripTime.toFixed(1)}ms with zero packet loss events above 1%. Network performance is excellent.`,
      evidence: `Avg trip: ${avgTripTime.toFixed(1)}ms | High-loss events: 0`
    });
  }

    return finalizeDiagnostics(diagnostics);
}

let modeChartInstance = null;

  const logFilename = loadedFiles.dslog ? loadedFiles.dslog.name.replace('.dslog', '') : '';

    logFilename,
    healthScore: metrics.health,
    minVoltage: +metrics.minV.toFixed(2),
    avgVoltage: +metrics.avgV.toFixed(2),
    maxPacketLoss: +(metrics.maxLoss * 100).toFixed(1),
    avgTripTime: +metrics.avgTrip.toFixed(1),

    teleopDuration: +(metrics.teleopRecs.length * 0.02).toFixed(1),
    criticalErrors: metrics.critErrors,
