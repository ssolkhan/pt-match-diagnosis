<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyroTech Match Diagnostics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-alt: #F5F3EF;
  --border: #E8E4DC;
  --border-strong: #D1CBC0;
  --text: #1A1714;
  --text-secondary: #6B6560;
  --text-muted: #9B9590;
  --maroon: #8B1A1A;
  --maroon-light: #B22222;
  --maroon-bg: #FDF2F2;
  --fire: #D4453A;
  --fire-glow: #FF6B35;
  --green: #1B7D3A;
  --green-bg: #EEFBF0;
  --green-border: #B4E5BE;
  --yellow: #B8860B;
  --yellow-bg: #FFF9E6;
  --yellow-border: #F0D878;
  --red: #C41E1E;
  --red-bg: #FFF0F0;
  --red-border: #F5A3A3;
  --blue: #1E5FC4;
  --blue-bg: #EEF4FF;
  --blue-border: #A3C4F5;
  --auto-color: #3B82F6;
  --teleop-color: #22C55E;
  --disabled-color: #9CA3AF;
  --radius: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ========== HEADER ========== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-logo .fire-icon {
  font-size: 28px;
  filter: drop-shadow(0 0 6px rgba(212,69,58,0.4));
}

.header-logo h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--maroon);
  letter-spacing: -0.5px;
}

.header-logo h1 span {
  color: var(--text-muted);
  font-weight: 400;
  font-size: 15px;
  margin-left: 6px;
}

.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.match-badge {
  background: var(--maroon-bg);
  color: var(--maroon);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  display: none;
}
.battery-badge {
  background: var(--yellow-bg);
  color: var(--yellow);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  display: none;
}
.event-badge {
  background: var(--blue-bg);
  color: var(--blue);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  display: none;
}
.save-status {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  padding: 4px 10px;
  border-radius: 12px;
  display: none;
}
.save-status.saving { background: var(--yellow-bg); color: var(--yellow); }
.save-status.saved { background: var(--green-bg); color: var(--green); }
.save-status.error { background: var(--red-bg); color: var(--red); }

/* ========== MATCH HISTORY TAB ========== */
.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.history-table th {
  background: var(--surface-alt);
  padding: 10px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}
.history-table th:hover { color: var(--maroon); background: var(--maroon-bg); }
.history-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
.history-table tr:hover td { background: var(--surface-alt); }
.history-table .health-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}
.history-loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

/* ========== DROP ZONE ========== */
.drop-zone-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 64px);
  padding: 40px;
}

.drop-zone {
  width: 100%;
  max-width: 640px;
  border: 2px dashed var(--border-strong);
  border-radius: 16px;
  padding: 60px 40px;
  text-align: center;
  background: var(--surface);
  transition: all 0.3s ease;
  cursor: pointer;
}

.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--maroon);
  background: var(--maroon-bg);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.drop-zone .icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.drop-zone h2 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 8px;
}

.drop-zone p {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.6;
}

.drop-zone .hint {
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.drop-zone input[type="file"] {
  display: none;
}

/* ========== MAIN LAYOUT ========== */
.main-content {
  display: none;
  padding: 0 24px 40px;
}

.main-content.active {
  display: block;
}

/* ========== TABS ========== */
.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-alt);
  border-radius: var(--radius);
  padding: 4px;
  margin: 20px 0;
  border: 1px solid var(--border);
  width: fit-content;
}

.tab-btn {
  padding: 10px 22px;
  border: none;
  background: transparent;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.tab-btn:hover {
  color: var(--text);
  background: rgba(255,255,255,0.6);
}

.tab-btn.active {
  background: var(--surface);
  color: var(--maroon);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== MATCH SUMMARY TAB ========== */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: transform 0.15s;
}

.stat-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.stat-card .label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.stat-card .value {
  font-size: 28px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -1px;
}

.stat-card .sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.stat-card.danger .value { color: var(--red); }
.stat-card.warning .value { color: var(--yellow); }
.stat-card.good .value { color: var(--green); }
.stat-card.info .value { color: var(--blue); }

/* Health Score */
.health-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
}

.health-bar-container {
  display: flex;
  align-items: center;
  gap: 20px;
}

.health-score-num {
  font-size: 48px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  min-width: 80px;
}

.health-bar-track {
  flex: 1;
  height: 16px;
  background: var(--surface-alt);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.health-bar-fill {
  height: 100%;
  border-radius: 8px;
  transition: width 1s ease;
}

.health-label {
  font-size: 14px;
  font-weight: 600;
  min-width: 100px;
  text-align: right;
}

/* Mode timeline mini bar */
.mode-bar-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
}

.mode-bar-section h3 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}

.mode-bar {
  height: 32px;
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  border: 1px solid var(--border);
}

.mode-bar .segment {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: white;
  font-family: 'JetBrains Mono', monospace;
  min-width: 1px;
}

.mode-bar .segment.auto { background: var(--auto-color); }
.mode-bar .segment.teleop { background: var(--teleop-color); }
.mode-bar .segment.disabled { background: var(--disabled-color); }
.mode-bar .segment.disconnected { background: #E5E7EB; color: var(--text-muted); }

.mode-legend {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.mode-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.mode-legend .dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* ========== UNIFIED TIMELINE TAB ========== */
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.chart-container canvas {
  width: 100% !important;
}

.chart-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.chart-toggle {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.chart-toggle.active {
  background: var(--maroon);
  color: white;
  border-color: var(--maroon);
}

.chart-toggle:hover:not(.active) {
  border-color: var(--maroon);
  color: var(--maroon);
}

/* ========== ERRORS & WARNINGS TAB ========== */
.error-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.filter-chip {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 20px;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.filter-chip.active { border-color: var(--maroon); background: var(--maroon-bg); color: var(--maroon); }
.filter-chip .count {
  background: var(--surface-alt);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}

.filter-chip.active .count { background: rgba(139,26,26,0.15); }

.error-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.error-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 4px solid transparent;
}

.error-item:hover { box-shadow: var(--shadow-sm); }
.error-item.critical { border-left-color: var(--red); }
.error-item.warning { border-left-color: var(--yellow); }
.error-item.info { border-left-color: var(--blue); }

.error-item .error-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.error-item .severity-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace;
}

.severity-badge.critical { background: var(--red-bg); color: var(--red); }
.severity-badge.warning { background: var(--yellow-bg); color: var(--yellow); }
.severity-badge.info { background: var(--blue-bg); color: var(--blue); }

.error-item .error-title {
  font-weight: 600;
  font-size: 14px;
  flex: 1;
}

.error-item .error-time {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
}

.error-item .error-count {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  background: var(--surface-alt);
  padding: 2px 8px;
  border-radius: 10px;
}

.error-item .error-detail {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.error-item.expanded .error-detail { display: block; }

.error-excerpt { margin-bottom: 8px; }
.excerpt-line {
  padding: 6px 10px;
  background: var(--red-bg);
  border-left: 3px solid var(--red);
  border-radius: 0 4px 4px 0;
  margin-bottom: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--red);
  font-weight: 600;
}
.error-location {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--blue);
  margin-bottom: 8px;
}
.stack-trace {
  margin: 8px 0;
  padding: 8px 12px;
  background: var(--surface-alt);
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.stack-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stack-team {
  color: var(--maroon);
  font-weight: 600;
  padding: 2px 0;
}
.stack-lib {
  color: var(--text-muted);
  font-size: 10px;
  padding: 2px 0;
}
.raw-toggle {
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 0;
  font-family: 'JetBrains Mono', monospace;
  user-select: none;
}
.raw-toggle:hover { color: var(--maroon); }
.raw-content {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  white-space: pre-wrap;
  word-break: break-all;
  padding: 8px;
  background: var(--surface-alt);
  border-radius: 4px;
  margin-top: 4px;
  max-height: 200px;
  overflow-y: auto;
}

.error-item.noise-item { opacity: 0.5; }
.error-item.noise-item .error-header { font-style: italic; }

/* ========== AI DIAGNOSTICS TAB ========== */
.diag-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 24px 0 12px;
}

.diag-section-title:first-child { margin-top: 0; }

.action-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.action-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  border-left: 5px solid transparent;
}

.action-card.fix-now {
  border-left-color: var(--red);
  background: var(--red-bg);
  border-color: var(--red-border);
}

.action-card.investigate {
  border-left-color: var(--yellow);
  background: var(--yellow-bg);
  border-color: var(--yellow-border);
}

.action-card.monitor {
  border-left-color: var(--green);
  background: var(--green-bg);
  border-color: var(--green-border);
}

.action-card .card-priority {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
  font-family: 'JetBrains Mono', monospace;
}

.action-card.fix-now .card-priority { color: var(--red); }
.action-card.investigate .card-priority { color: var(--yellow); }
.action-card.monitor .card-priority { color: var(--green); }

.action-card .card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}

.action-card .card-body {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.action-card .card-evidence {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(0,0,0,0.08);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  line-height: 1.6;
}

.no-issues {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 15px;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .main-content { padding: 0 12px 24px; }
  .tabs { overflow-x: auto; width: 100%; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-card .value { font-size: 22px; }
}

/* ========== CROSS-HIGHLIGHT ========== */
.error-item.highlighted {
  background: var(--yellow-bg) !important;
  border-color: var(--yellow-border) !important;
  box-shadow: var(--shadow-md);
}

.error-item .seek-btn {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  border-radius: 4px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  color: var(--maroon);
  margin-left: 6px;
  transition: all 0.15s;
}
.error-item .seek-btn:hover { background: var(--maroon); color: white; }

/* ========== PIT BRIEF ========== */
.pit-scores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  margin-bottom: 24px;
}

.pit-score-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  text-align: center;
  transition: transform 0.15s;
}
.pit-score-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.stoplight {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: white;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.stoplight.red { background: linear-gradient(135deg, #C41E1E, #E53E3E); }
.stoplight.yellow { background: linear-gradient(135deg, #B8860B, #D4A017); }
.stoplight.green { background: linear-gradient(135deg, #1B7D3A, #38A169); }

.pit-score-label {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.pit-score-detail {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ========== POWER HEATMAP ========== */
.top-consumers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

.consumer-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  border-left: 4px solid var(--fire);
}

.consumer-card .ch-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.consumer-card .ch-value {
  font-size: 24px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fire);
}

.consumer-card .ch-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ========== CHART FULLSCREEN ========== */
.chart-fullscreen {
  position: fixed !important;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  height: 100vh !important;
  background: var(--bg);
  padding: 20px;
  border-radius: 0 !important;
  border: none !important;
}

<script>
// ========================================================================
// PYROTECH MATCH AUTOPSY — BINARY PARSERS & DIAGNOSTIC ENGINE
// ========================================================================

// ==================== PDH CHANNEL CONFIGURATION ====================
// Maps PDH channels to CAN IDs and mechanism names.
// Update when wiring changes.
const PDH_CHANNELS = [
  { channel: 0,  canId: 4,  name: 'Swerve Drive RF',  group: 'Drivetrain' },
  { channel: 1,  canId: 3,  name: 'Swerve Turn RF',   group: 'Drivetrain' },
  { channel: 2,  canId: null, name: 'Ch 2',           group: 'Unused' },
  { channel: 3,  canId: null, name: 'Ch 3',           group: 'Unused' },
  { channel: 4,  canId: 20, name: 'Intake Deploy',    group: 'Intake' },
  { channel: 5,  canId: 21, name: 'Intake Roller 1',  group: 'Intake' },
  { channel: 6,  canId: 22, name: 'Intake Roller 2',  group: 'Intake' },
  { channel: 7,  canId: 50, name: 'Climber',          group: 'Climber' },
  { channel: 8,  canId: 1,  name: 'Swerve Turn LF',   group: 'Drivetrain' },
  { channel: 9,  canId: 2,  name: 'Swerve Drive LF',  group: 'Drivetrain' },
  { channel: 10, canId: 31, name: 'Spindexer',        group: 'Indexer' },
  { channel: 11, canId: 32, name: 'Indexer',           group: 'Indexer' },
  { channel: 12, canId: 40, name: 'Turret',            group: 'Shooter' },
  { channel: 13, canId: 42, name: 'Kraken 1',          group: 'Shooter' },
  { channel: 14, canId: 41, name: 'Kraken 2',          group: 'Shooter' },
  { channel: 15, canId: 99, name: 'LimeLight',         group: 'Sensors' },
  { channel: 16, canId: 5,  name: 'Swerve Turn BL',   group: 'Drivetrain' },
  { channel: 17, canId: 6,  name: 'Swerve Drive BL',  group: 'Drivetrain' },
  { channel: 18, canId: 7,  name: 'Swerve Turn BR',   group: 'Drivetrain' },
  { channel: 19, canId: 8,  name: 'Swerve Drive BR',  group: 'Drivetrain' },
  { channel: 20, canId: 99, name: 'CANcoders',         group: 'Sensors' },
  { channel: 21, canId: 99, name: 'VRM',               group: 'Power' },
  { channel: 22, canId: null, name: 'Ch 22',           group: 'Unused' },
  { channel: 23, canId: null, name: 'Ch 23',           group: 'Unused' },
];
const PDH_BY_CHANNEL = {};
PDH_CHANNELS.forEach(ch => { PDH_BY_CHANNEL[ch.channel] = ch; });
const PDH_BY_CAN_ID = {};
PDH_CHANNELS.filter(ch => ch.canId !== null).forEach(ch => {
  if (!PDH_BY_CAN_ID[ch.canId]) PDH_BY_CAN_ID[ch.canId] = [];
  PDH_BY_CAN_ID[ch.canId].push(ch);
});
const PDH_GROUP_COLORS = {
  'Drivetrain': '#1E5FC4', 'Intake': '#059669', 'Climber': '#7C3AED',
  'Indexer': '#B8860B', 'Shooter': '#C41E1E', 'Sensors': '#6366F1',
  'Power': '#F97316', 'Unused': '#9CA3AF',
};
function pdhName(ch) { return PDH_BY_CHANNEL[ch]?.name || ('Ch ' + ch); }
function pdhGroup(ch) { return PDH_BY_CHANNEL[ch]?.group || 'Unknown'; }
function pdhColor(ch) { return PDH_GROUP_COLORS[pdhGroup(ch)] || '#6B6560'; }
const POWER_SERIES_PALETTE = [
  '#2563EB', '#DC2626', '#059669', '#D97706', '#7C3AED', '#0891B2',
  '#DB2777', '#65A30D', '#EA580C', '#4F46E5', '#0F766E', '#B91C1C',
  '#9333EA', '#0284C7', '#16A34A', '#C2410C', '#BE185D', '#1D4ED8',
  '#15803D', '#A16207', '#6D28D9', '#0E7490', '#E11D48', '#334155'
];

function powerSeriesColor(ch) {
  return POWER_SERIES_PALETTE[Math.abs(ch) % POWER_SERIES_PALETTE.length];
}

const MAX_INT64 = BigInt("9223372036854775807");
const LV_EPOCH = new Date(Date.UTC(1904, 0, 1));
const UINT64_SCALE = 18446744073709551616;

function readLabviewTimestampSeconds(view, pos) {
  const seconds = view.getBigInt64(pos);
  const fractional = view.getBigUint64(pos + 8);
  return Number(seconds) + Number(fractional) / UINT64_SCALE;
}

function computeCanPeak(matchRecords) {
  const stableCan = matchRecords.filter(r => r.canUsage !== null && r.canUsage < 0.70);
  const highCanSustained = matchRecords.filter((r, i, arr) => {
    if (r.canUsage === null || r.canUsage < 0.70) return false;
    const prev = i > 0 ? arr[i - 1] : null;
    const next = i < arr.length - 1 ? arr[i + 1] : null;
    return (prev && prev.canUsage !== null && prev.canUsage > 0.30) &&
           (next && next.canUsage !== null && next.canUsage > 0.30);
  });
  const allValidCan = [...stableCan, ...highCanSustained];
  return allValidCan.length ? Math.max(...allValidCan.map(r => r.canUsage)) : 0;
}

function computeBatteryResistanceMetrics(matchRecords) {
  let worstResistance = 0;
  let worstResTime = 0;
  let highResCount = 0;
  for (let i = 10; i < matchRecords.length; i++) {
    const v1 = matchRecords[i - 10].voltage;
    const v2 = matchRecords[i].voltage;
    const c1 = matchRecords[i - 10].totalCurrent || 0;
    const c2 = matchRecords[i].totalCurrent || 0;
    const deltaI = c2 - c1;
    if (v1 !== null && v2 !== null && deltaI > 40) {
      const resistance = Math.abs(v1 - v2) / deltaI;
      if (resistance > worstResistance) {
        worstResistance = resistance;
        worstResTime = matchRecords[i].time_s;
      }
      if (resistance > 0.025) highResCount++;
    }
  }
  return { worstResistance, worstResTime, highResCount };
}

function summarizeMatchMetrics(records, eventData) {
  const matchRecs = records.filter(r => r.mode === 'auto' || r.mode === 'teleop');
  const autoRecs = records.filter(r => r.mode === 'auto');
  const teleopRecs = records.filter(r => r.mode === 'teleop');
  const validV = matchRecs.filter(r => r.voltage !== null);
  const validLoss = matchRecs.filter(r => r.packetLoss !== null);
  const minV = validV.length ? Math.min(...validV.map(r => r.voltage)) : 0;
  const avgV = validV.length ? validV.reduce((s, r) => s + r.voltage, 0) / validV.length : 0;
  const maxV = validV.length ? Math.max(...validV.map(r => r.voltage)) : 0;
  const maxLoss = validLoss.length ? Math.max(...validLoss.map(r => r.packetLoss)) : 0;
  const avgLoss = validLoss.length ? validLoss.reduce((s, r) => s + r.packetLoss, 0) / validLoss.length : 0;
  const maxCan = computeCanPeak(matchRecs);
  const brownouts = records.filter(r => r.brownout).length;
  const critErrors = eventData.events.filter(e => e.severity === 'critical' && !e.noise).length;
  const warnings = eventData.events.filter(e => e.severity === 'warning' && !e.noise).length;
  const canTimeouts = eventData.events.filter(e => e.category === 'CAN' && e.title.includes('Timeout'));
  const canStale = eventData.events.filter(e => e.category === 'CAN' && e.title.includes('Stale'));
  const avgCpu = matchRecs.length ? matchRecs.reduce((s, r) => s + r.rioCpu * 100, 0) / matchRecs.length : 0;
  const maxCpu = matchRecs.length ? Math.max(...matchRecs.map(r => r.rioCpu * 100)) : 0;
  const avgTrip = matchRecs.length ? matchRecs.reduce((s, r) => s + r.tripTime, 0) / matchRecs.length : 0;
  const batteryMetrics = computeBatteryResistanceMetrics(matchRecs);

  let modeFlips = 0;
  for (let i = 1; i < records.length; i++) {
    if (records[i].mode !== records[i - 1].mode) modeFlips++;
  }
  const totalDuration = records.length * 0.02;
  const flickerRate = modeFlips / (totalDuration || 1);

  let health = 100;
  const penalties = [];
  if (minV < 8) { health -= 40; penalties.push('Voltage collapse (<8V): −40'); }
  else if (minV < 10) { health -= 25; penalties.push('Severe voltage drop (<10V): −25'); }
  else if (minV < 11) { health -= 10; penalties.push('Voltage sag (<11V): −10'); }
  if (brownouts > 5) { health -= 25; penalties.push('Multiple brownouts (>5): −25'); }
  else if (brownouts > 0) { health -= 15; penalties.push(`Brownouts (${brownouts}): −15`); }
  if (maxLoss > 0.20) { health -= 15; penalties.push('Severe packet loss (>20%): −15'); }
  else if (maxLoss > 0.05) { health -= 8; penalties.push('Elevated packet loss (>5%): −8'); }
  if (flickerRate > 2.0) { health -= 15; penalties.push('Severe comms flicker: −15'); }
  else if (flickerRate > 0.5) { health -= 5; penalties.push('Comms instability: −5'); }
  if (canTimeouts.length > 3) { health -= 15; penalties.push(`CAN timeouts (${canTimeouts.length}): −15`); }
  else if (canTimeouts.length > 0) { health -= 8; penalties.push(`CAN timeout (${canTimeouts.length}): −8`); }
  if (canStale.length > 10) { health -= 10; penalties.push(`CAN stale data (${canStale.length}): −10`); }
  else if (canStale.length > 0) { health -= 5; penalties.push(`CAN stale data (${canStale.length}): −5`); }
  if (maxCan > 0.70) { health -= 8; penalties.push('High CAN utilization (>70%): −8'); }
  if (critErrors > 3) { health -= 15; penalties.push(`Many critical errors (${critErrors}): −15`); }
  else if (critErrors > 0) { health -= 8; penalties.push(`Critical errors (${critErrors}): −8`); }
  if (avgCpu > 85) { health -= 8; penalties.push('High avg CPU (>85%): −8'); }
  else if (maxCpu > 95) { health -= 5; penalties.push('CPU spike (>95%): −5'); }
  if (autoRecs.length * 0.02 < 5 && autoRecs.length > 0) { health -= 10; penalties.push('Short auto (<5s): −10'); }
  if (matchRecs.length === 0) { health = 5; penalties.push('No match activity: forced to 5'); }
  health = Math.max(0, Math.min(100, health));

  return {
    matchRecs, autoRecs, teleopRecs, minV, avgV, maxV, maxLoss, avgLoss, maxCan,
    brownouts, critErrors, warnings, canTimeouts, canStale, avgCpu, maxCpu,
    avgTrip, flickerRate, penalties, health, batteryMetrics
  };
}

function formatMatchClock(seconds) {
  if (seconds === undefined || seconds === null || !isFinite(seconds)) return '';
  const sign = seconds < 0 ? '-' : '';
  const totalSeconds = Math.max(0, Math.round(Math.abs(seconds)));
  const minutes = Math.floor(totalSeconds / 60);
  const secs = totalSeconds % 60;
  return `${sign}${minutes}:${String(secs).padStart(2, '0')}`;
}

function getMatchRelativeLabel(time_s, bounds = window._matchBounds) {
  if (!bounds || !bounds.hasMatchData || bounds.enabledStart == null || bounds.enabledEnd == null) return '';
  if (time_s < bounds.enabledStart || time_s > bounds.enabledEnd) return '';
  return formatMatchClock(time_s - bounds.enabledStart);
}

function getNearbyEventTooltipLines(events, time_s, windowSeconds = 3, limit = 3) {
  if (!events || time_s === undefined || time_s === null) return [];
  const nearby = events.filter(e => Math.abs((e.time_s ?? Infinity) - time_s) < windowSeconds);
  const rankByDistance = (a, b) => Math.abs((a.time_s ?? 0) - time_s) - Math.abs((b.time_s ?? 0) - time_s);
  const actionable = nearby
    .filter(e => e.severity === 'critical' || e.severity === 'warning')
    .sort((a, b) => {
      const sevRank = { critical: 0, warning: 1 };
      const rankDiff = (sevRank[a.severity] ?? 2) - (sevRank[b.severity] ?? 2);
      if (rankDiff !== 0) return rankDiff;
      return rankByDistance(a, b);
    });

  const meaningfulInfo = nearby
    .filter(e => {
      if (e.severity !== 'info') return false;
      const text = `${e.category || ''} ${e.title || ''}`.toLowerCase();
      return [
        'code start',
        'radio',
        'ping',
        'brownout',
        'stale',
        'timeout',
        'disconnect',
        'reconnect',
        'loop overrun',
        'watchdog',
        'roborio',
        'can'
      ].some(keyword => text.includes(keyword));
    })
    .sort(rankByDistance);

  const chosen = actionable.length > 0
    ? actionable.slice(0, limit)
    : meaningfulInfo.slice(0, Math.min(2, limit));

  const lines = chosen.map(e => `[${(e.severity || 'info').toUpperCase()}] ${e.title.substring(0, 50)}`);
  const nearbyLabel = actionable.length > 0 ? '--- Nearby Warnings / Errors ---' : '--- Nearby Log Messages ---';
  const nearbyDisplay = lines.length ? [nearbyLabel, ...lines] : [];
  return nearbyDisplay;
}

function extractCanIdsFromText(text) {
  if (!text) return [];
  const ids = new Set();
  const explicitIdListMatches = [
    ...text.matchAll(/\bIDs?\s*:\s*([0-9,\s]+)/ig),
    ...text.matchAll(/\bCAN IDs?\s*:\s*([0-9,\s]+)/ig)
  ];
  if (explicitIdListMatches.length > 0) {
    explicitIdListMatches.forEach(match => {
      match[1].split(',').forEach(part => {
        const id = Number(part.trim());
        if (Number.isFinite(id) && id >= 0 && id <= 63) ids.add(id);
      });
    });
    if (ids.size > 1 && ids.has(0)) ids.delete(0);
    return [...ids].sort((a, b) => a - b);
  }
  const patterns = [
    /\bCAN ID\s*(\d{1,3})\b/ig,
    /\bCAN IDs?\s*(\d{1,3})\b/ig,
    /\bIDs?\s*(\d{1,3})\b/ig,
    /\bmessage\s*(\d{1,3})\s*not found\b/ig,
    /\bdevice id\s*(\d{1,3})\b/ig
  ];
  patterns.forEach(regex => {
    let match;
    while ((match = regex.exec(text)) !== null) {
      const id = Number(match[1]);
      if (Number.isFinite(id) && id >= 0 && id <= 63) ids.add(id);
    }
  });
  if (ids.size > 1 && ids.has(0)) ids.delete(0);
  return [...ids].sort((a, b) => a - b);
}

function formatCanDeviceList(ids) {
  if (!ids || ids.length === 0) return '';
  return ids.map(id => {
    const mapped = PDH_BY_CAN_ID[id];
    const mechName = mapped && mapped.length > 0 ? mapped[0].name : null;
    return mechName ? `${id} (${mechName})` : String(id);
  }).join(', ');
}

function collectCanIdsFromEvents(events) {
  const ids = new Set();
  (events || []).forEach(e => extractCanIdsFromText(e.text || '').forEach(id => ids.add(id)));
  return [...ids].sort((a, b) => a - b);
}

function extractCanMismatchInfo(text) {
  const mismatchRegex = /(not a spark max|not a spark flex|not a talon fx|not a talon srx|functionalities may not work)/i;
  const match = (text || '').match(mismatchRegex);
  if (!match || match.index === undefined) return null;
  const snippetStart = Math.max(0, match.index - 80);
  const snippetEnd = Math.min((text || '').length, match.index + match[0].length + 160);
  const snippet = (text || '').slice(snippetStart, snippetEnd).replace(/\s+/g, ' ').trim();
  const ids = extractCanIdsFromText(snippet);
  const canId = ids.length > 0 ? ids[0] : null;
  const mapped = canId !== null ? PDH_BY_CAN_ID[canId] : null;
  const mechName = mapped && mapped.length > 0 ? mapped[0].name : null;
  return { canId, mechName, snippet };
}

function inferDiagnosticPriority(item, bucket) {
  let score = bucket === 'fixNow' ? 300 : bucket === 'investigate' ? 200 : 100;
  const title = item.title || '';
  if (title.includes('Radio Reboot')) score += 120;
  else if (title.includes('CAN Device Mismatch')) score += 115;
  else if (title.includes('Robot Code Exceptions')) score += 110;
  else if (title.includes('Voltage Crash + CAN Failure Correlation')) score += 108;
  else if (title.includes('Total Current Spike')) score += 105;
  else if (title.includes('CAN Bus Timeouts')) score += 100;
  else if (title.includes('Critical Voltage Collapse')) score += 95;
  else if (title.includes('Brownout Events')) score += 90;
  else if (title.includes('Code Loop Overrun') && title.includes('SEVERE')) score += 88;
  else if (title.includes('Severe Communications Instability')) score += 82;
  else if (title.includes('Stale CAN Data')) score += 72;
  else if (title.includes('High CAN Bus Utilization')) score += 65;
  else if (title.includes('Elevated Packet Loss')) score += 60;
  else if (title.includes('Moderate Voltage Sag')) score += 55;
  if (item.time_s !== undefined && item.time_s !== null) score += 1;
  return score;
}

function finalizeDiagnostics(diagnostics) {
  const clone = {
    fixNow: [...diagnostics.fixNow],
    investigate: [...diagnostics.investigate],
    monitor: [...diagnostics.monitor]
  };

  const hasFixTitle = title => clone.fixNow.some(d => d.title === title);
  const hasInvestigateTitle = title => clone.investigate.some(d => d.title === title);

  if (hasFixTitle('🔗 Voltage Crash + CAN Failure Correlation') || hasFixTitle('🔌 Total Current Spike — Main Breaker Trip Hazard')) {
    clone.fixNow = clone.fixNow.filter(d => !['🔋 Critical Voltage Collapse', '🔋 Severe Voltage Drops', '⚡ Brownout Events Detected'].includes(d.title));
    clone.investigate = clone.investigate.filter(d => d.title !== '🎮 Early Teleop Power Spike');
  }

  if (hasFixTitle('📡 Radio Reboot Detected')) {
    clone.fixNow = clone.fixNow.filter(d => d.title !== '📡 Severe Communications Instability');
  }

  if (hasFixTitle('🚨 CAN Bus Timeouts')) {
    clone.investigate = clone.investigate.filter(d => d.title !== '📊 High CAN Bus Utilization');
  }

  ['fixNow', 'investigate', 'monitor'].forEach(bucket => {
    clone[bucket] = clone[bucket]
      .map(item => ({ ...item, priorityScore: inferDiagnosticPriority(item, bucket) }))
      .sort((a, b) => b.priorityScore - a.priorityScore || ((a.time_s ?? Infinity) - (b.time_s ?? Infinity)));
  });

  return clone;
}
