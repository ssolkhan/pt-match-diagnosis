async function analyzeLogBuffers(logBuf, evBuf, meta = {}, fileMeta = {}) {
  currentMatchMeta = meta;
  pendingLogBuffers = null;
  if (fileMeta.dslogName || fileMeta.dseventsName) {
    loadedFiles = {
      dslog: { name: fileMeta.dslogName || 'github.dslog' },
      dsevents: { name: fileMeta.dseventsName || 'github.dsevents' }
    };
  }
  try {
    const logData = parseDSLog(logBuf);
    const eventData = parseDSEvents(evBuf);
    renderDashboard(logData, eventData, currentMatchMeta);
  } catch (err) {
    alert('Error parsing log files: ' + err.message);
    console.error(err);
    document.querySelector('.drop-zone h2').textContent = 'Drop Robot Logs Here';
    document.querySelector('.drop-zone p').innerHTML = 'Drag & drop your <strong>.dslog</strong> and <strong>.dsevents</strong> files<br>or click to browse';
    document.querySelector('.drop-zone .hint').style.display = 'block';
    document.getElementById('metaInputs').style.display = 'none';
    throw err;
  }
}

async function loadGithubMatch() {
  if (!githubSelectedMatch) return;
  setGithubStatus('Downloading GitHub log pair...', 'info');
  document.querySelector('.drop-zone h2').textContent = 'Loading GitHub logs...';
  try {
    const [logBuf, evBuf] = await Promise.all([
      fetch('/api/github-file?path=' + encodeURIComponent(githubSelectedMatch.dslogPath)).then(r => {
        if (!r.ok) throw new Error('Failed to download .dslog');
        return r.arrayBuffer();
      }),
      fetch('/api/github-file?path=' + encodeURIComponent(githubSelectedMatch.dseventsPath)).then(r => {
        if (!r.ok) throw new Error('Failed to download .dsevents');
        return r.arrayBuffer();
      })
    ]);
    pendingLogBuffers = {
      logBuf,
      evBuf,
      dslogName: githubSelectedMatch.dslogName,
      dseventsName: githubSelectedMatch.dseventsName
    };
    loadedFiles = {
      dslog: { name: githubSelectedMatch.dslogName },
      dsevents: { name: githubSelectedMatch.dseventsName }
    };
    document.querySelector('.drop-zone h2').textContent = '✓ GitHub Logs Ready';
    document.querySelector('.drop-zone p').innerHTML =
      '<strong style="color:var(--green)">✓ .dslog</strong> + <strong style="color:var(--green)">✓ .dsevents</strong><br>Downloaded from GitHub and ready to analyze';
    document.querySelector('.drop-zone .hint').style.display = 'none';
    document.getElementById('metaInputs').style.display = 'block';
    document.getElementById('batteryIdInput').focus();
    document.getElementById('eventNameInput').value = getGithubEventName();
    setGithubStatus('GitHub logs downloaded. Add battery ID if you have it, then analyze.', 'success');
  } catch (error) {
    pendingLogBuffers = null;
    setGithubStatus(error.message, 'error');
    document.querySelector('.drop-zone h2').textContent = 'Drop Robot Logs Here';
  }
}

function handleFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'dslog' || ext === 'dsevents') {
      loadedFiles[ext] = file;
    }
  }

  if (loadedFiles.dslog && loadedFiles.dsevents) {
    // Both files ready — show meta inputs
    document.querySelector('.drop-zone h2').textContent = '✓ Files Ready';
    document.querySelector('.drop-zone p').innerHTML =
      '<strong style="color:var(--green)">✓ .dslog</strong> + <strong style="color:var(--green)">✓ .dsevents</strong>';
    document.querySelector('.drop-zone .hint').style.display = 'none';
    document.getElementById('metaInputs').style.display = 'block';
    // Restore last event name
    const lastEvent = localStorage.getItem('pt_lastEventName');
    if (lastEvent) document.getElementById('eventNameInput').value = lastEvent;
  } else if (loadedFiles.dslog || loadedFiles.dsevents) {
    const have = loadedFiles.dslog ? '.dslog' : '.dsevents';
    const need = loadedFiles.dslog ? '.dsevents' : '.dslog';
    document.querySelector('.drop-zone p').innerHTML =
      `<strong style="color:var(--green)">✓ ${have} loaded</strong><br>Now drop the matching <strong>${need}</strong> file`;
  }
}

function triggerParse() {
  const batteryId = document.getElementById('batteryIdInput').value.trim();
  const eventName = document.getElementById('eventNameInput').value.trim();
  // Save event name for next time
  if (eventName) localStorage.setItem('pt_lastEventName', eventName);
  currentMatchMeta = { batteryId, eventName };

  document.querySelector('.drop-zone h2').textContent = 'Parsing logs...';
  document.getElementById('metaInputs').style.display = 'none';

  if (pendingLogBuffers) {
    const { logBuf, evBuf, dslogName, dseventsName } = pendingLogBuffers;
    setTimeout(() => {
      analyzeLogBuffers(logBuf, evBuf, currentMatchMeta, {
        dslogName,
        dseventsName
      }).catch(() => {});
    }, 50);
    return;
  }

  Promise.all([
    loadedFiles.dslog.arrayBuffer(),
    loadedFiles.dsevents.arrayBuffer()
  ]).then(([logBuf, evBuf]) => {
    setTimeout(() => {
      analyzeLogBuffers(logBuf, evBuf, currentMatchMeta, {
        dslogName: loadedFiles.dslog?.name,
        dseventsName: loadedFiles.dsevents?.name
      }).catch(() => {});
    }, 50);
  });
}

function saveMatchToSheet(summary) {
  if (!APPS_SCRIPT_URL) return; // No backend configured
  const status = document.getElementById('saveStatus');
  status.style.display = 'inline-block';
  status.className = 'save-status saving';
  status.textContent = '⏳ Saving...';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(summary),
    mode: 'no-cors' // Apps Script requires this
  }).then((response) => {
    status.className = 'save-status saved';
    status.textContent = response && response.type !== 'opaque' && response.ok ? '✓ Saved' : '✓ Save sent';
    setTimeout(() => { status.style.display = 'none'; }, 3000);
  }).catch(err => {
    status.className = 'save-status error';
    status.textContent = '✗ Save failed';
    console.error('Save failed:', err);

function loadMatchHistory() {
  const container = document.getElementById('matchHistoryContent');
  if (!APPS_SCRIPT_URL) {
    container.innerHTML = '<div class="history-loading">Match history requires the Google Sheets backend.<br><span style="font-size:12px;color:var(--text-muted);">Set APPS_SCRIPT_URL in Vercel environment variables.</span></div>';
    return;
  }

  container.innerHTML = '<div class="history-loading">Loading match history...</div>';

  fetch(APPS_SCRIPT_URL)
    .then(r => r.json())
    .then(data => {
      if (!data.success || !data.matches || data.matches.length === 0) {
        container.innerHTML = '<div class="history-loading">No match history yet. Analyze a match to start recording.</div>';
        return;
      }

      const allMatches = data.matches.reverse(); // newest first
      let currentSort = { col: 'Timestamp', dir: 'desc' };
      let filterEvent = '';
      let filterBattery = '';

      // Column definitions: key, label, format function, width
      const columns = [
        { key: 'Timestamp', label: 'Date/Time', fmt: v => { try { const d = new Date(v); return d.toLocaleDateString('en-US', {month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'}); } catch(e) { return String(v||''); } }, width: '130px' },
        { key: 'Event Name', label: 'Event', fmt: v => v || '—', width: '150px' },
        { key: 'Match Type', label: 'Type', fmt: v => v || '—', width: '60px' },
        { key: 'Match Number', label: '#', fmt: v => v || '—', width: '40px' },
        { key: 'Battery ID', label: 'Battery', fmt: v => v || '—', width: '90px' },
        { key: 'Health Score', label: 'Health', fmt: v => v, width: '70px', health: true },
        { key: 'Min Voltage', label: 'Min V', fmt: v => Number(v||0).toFixed(1), width: '60px', warn: v => v < 10 },
        { key: 'Avg Voltage', label: 'Avg V', fmt: v => Number(v||0).toFixed(1), width: '60px' },
        { key: 'Max Packet Loss', label: 'Pkt Loss', fmt: v => Number(v||0).toFixed(1) + '%', width: '70px', warn: v => v > 5 },
        { key: 'Avg Trip Time', label: 'Trip ms', fmt: v => Number(v||0).toFixed(1), width: '60px' },
        { key: 'Comms Flicker Rate', label: 'Flicker/s', fmt: v => Number(v||0).toFixed(1), width: '70px', warn: v => v > 2 },
        { key: 'Peak CAN Usage', label: 'CAN%', fmt: v => Number(v||0).toFixed(0), width: '55px', warn: v => v > 70 },
        { key: 'Avg CPU', label: 'CPU%', fmt: v => Number(v||0).toFixed(0), width: '55px', warn: v => v > 85 },
        { key: 'Brownout Count', label: 'Brownouts', fmt: v => v || 0, width: '70px', warn: v => v > 0 },
        { key: 'Auto Duration', label: 'Auto s', fmt: v => Number(v||0).toFixed(1), width: '55px' },
        { key: 'Teleop Duration', label: 'Teleop s', fmt: v => Number(v||0).toFixed(1), width: '65px' },
        { key: 'Critical Errors', label: 'Crit', fmt: v => v || 0, width: '45px', warn: v => v > 0 },
        { key: 'Warnings', label: 'Warn', fmt: v => v || 0, width: '50px' },
        { key: 'Battery Resistance mΩ', label: 'R mΩ', fmt: v => Number(v||0).toFixed(1), width: '55px' },
        { key: 'Fix Now Items', label: 'Fix Now Items', fmt: v => v || '—', width: '200px' },
      ];

      // Get unique events and batteries for filter dropdowns
      const uniqueEvents = [...new Set(allMatches.map(m => m['Event Name']).filter(Boolean))];
      const uniqueBatteries = [...new Set(allMatches.map(m => m['Battery ID']).filter(Boolean))];

      function getFiltered() {
        let filtered = allMatches;
        if (filterEvent) filtered = filtered.filter(m => m['Event Name'] === filterEvent);
        if (filterBattery) filtered = filtered.filter(m => m['Battery ID'] === filterBattery);
        // Sort
        filtered = [...filtered].sort((a, b) => {
          let va = a[currentSort.col] ?? '';
          let vb = b[currentSort.col] ?? '';
          // Try numeric comparison
          const na = Number(va), nb = Number(vb);
          if (!isNaN(na) && !isNaN(nb)) {
            return currentSort.dir === 'asc' ? na - nb : nb - na;
          }
          // String comparison
          va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
          return currentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        return filtered;
      }

      function render() {
        const filtered = getFiltered();
        const healthColor = s => Number(s) >= 75 ? 'var(--green)' : Number(s) >= 50 ? 'var(--yellow)' : 'var(--red)';
        const sortArrow = col => currentSort.col === col ? (currentSort.dir === 'asc' ? ' ↑' : ' ↓') : '';

        container.innerHTML = `
          <div style="margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div style="font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Match History</div>
            <div style="font-size:12px;color:var(--text-muted);">${filtered.length} of ${allMatches.length} matches</div>
            <select id="histFilterEvent" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Outfit',sans-serif;font-size:12px;background:var(--surface);cursor:pointer;">
              <option value="">All Events</option>
              ${uniqueEvents.map(e => `<option value="${escapeHtml(e)}" ${filterEvent===e?'selected':''}>${escapeHtml(e)}</option>`).join('')}
            </select>
            <select id="histFilterBattery" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--surface);cursor:pointer;">
              <option value="">All Batteries</option>
              ${uniqueBatteries.map(b => `<option value="${escapeHtml(b)}" ${filterBattery===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}
            </select>
            <button onclick="loadMatchHistory()" style="margin-left:auto;padding:5px 12px;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;">↻ Refresh</button>
          </div>
          <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);">
            <table class="history-table" style="min-width:1400px;">
              <thead>
                <tr>
                  ${columns.map(c => `<th class="sortable-th" data-col="${c.key}" style="cursor:pointer;white-space:nowrap;min-width:${c.width};user-select:none;" title="Click to sort">${c.label}${sortArrow(c.key)}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${filtered.length === 0 ? `<tr><td colspan="${columns.length}" style="text-align:center;padding:24px;color:var(--text-muted);">No matches match the current filters.</td></tr>` :
                filtered.map(m => `
                  <tr>
                    ${columns.map(c => {
                      const raw = m[c.key];
                      const display = c.fmt(raw);
                      let style = '';
                      if (c.warn && c.warn(Number(raw||0))) style = 'color:var(--red);font-weight:600;';
                      if (c.health) {
                        const hc = healthColor(raw);
                        return `<td><span class="health-dot" style="background:${hc}"></span><span style="color:${hc};font-weight:600;">${display}</span></td>`;
                      }
                      if (c.key === 'Fix Now Items') {
                        return `<td style="font-family:'Outfit',sans-serif;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(String(raw||''))}">${escapeHtml(String(display))}</td>`;
                      }
                      return `<td style="${style}">${escapeHtml(String(display))}</td>`;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        // Bind sort handlers
        container.querySelectorAll('.sortable-th').forEach(th => {
          th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (currentSort.col === col) {
              currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
              currentSort = { col, dir: 'asc' };
            }
            render();
          });
        });

        // Bind filter handlers
        const evSelect = document.getElementById('histFilterEvent');
        const batSelect = document.getElementById('histFilterBattery');
        if (evSelect) evSelect.addEventListener('change', () => { filterEvent = evSelect.value; render(); });
        if (batSelect) batSelect.addEventListener('change', () => { filterBattery = batSelect.value; render(); });
      }

      render();

      // ---- Battery Trending Chart ----
      renderBatteryTrend(allMatches);
    })
    .catch(err => {
      container.innerHTML = '<div class="history-loading">Failed to load match history.<br><span style="font-size:12px;color:var(--text-muted);">' + escapeHtml(err.message) + '</span></div>';
    });
}

let batteryTrendChartInstance = null;

function renderBatteryTrend(allMatches) {
  const trendContainer = document.getElementById('batteryTrendContainer');
  if (!allMatches || allMatches.length < 2) {
    trendContainer.style.display = 'none';
    return;
  }
  trendContainer.style.display = 'block';

  // Group matches by Battery ID
  const batteryGroups = {};
  const chronological = [...allMatches].reverse(); // oldest first
  chronological.forEach(m => {
    const bid = m['Battery ID'] || 'Unknown';
    if (!batteryGroups[bid]) batteryGroups[bid] = [];
    batteryGroups[bid].push(m);
  });

  const batteryIds = Object.keys(batteryGroups).filter(b => batteryGroups[b].length >= 1);
  const trendColors = ['#C41E1E','#1E5FC4','#059669','#7C3AED','#B8860B','#D4453A','#FF6B35','#6366F1','#EC4899','#14B8A6'];

  let trendMetric = 'Min Voltage';
  const metrics = [
    { key: 'Min Voltage', label: 'Min Voltage (V)', warn: 10 },
    { key: 'Avg Voltage', label: 'Avg Voltage (V)', warn: 11.5 },
    { key: 'Health Score', label: 'Health Score', warn: 50 },
    { key: 'Battery Resistance mΩ', label: 'Resistance (mΩ)', warn: 25 }
  ];

  function renderTrendFilters() {
    document.getElementById('batteryTrendFilters').innerHTML = metrics.map(m =>
      `<button class="chart-toggle ${trendMetric === m.key ? 'active' : ''}" data-metric="${m.key}">${m.label}</button>`
    ).join('');
    document.querySelectorAll('#batteryTrendFilters .chart-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        trendMetric = btn.dataset.metric;
        renderTrendFilters();
        buildTrendChart();
      });
    });
  }

  function buildTrendChart() {
    const metric = metrics.find(m => m.key === trendMetric);
    // X-axis: match labels (sequential)
    const maxLen = Math.max(...batteryIds.map(b => batteryGroups[b].length));
    const labels = [];
    for (let i = 0; i < maxLen; i++) labels.push('Match ' + (i + 1));

    const datasets = batteryIds.map((bid, idx) => {
      const matches = batteryGroups[bid];
      const data = matches.map(m => {
        const val = Number(m[trendMetric] || 0);
        return val || null;
      });
      return {
        label: bid,
        data: data,
        borderColor: trendColors[idx % trendColors.length],
        backgroundColor: trendColors[idx % trendColors.length] + '20',
        borderWidth: 2,
        pointRadius: 4,
        pointHitRadius: 8,
        fill: false,
        tension: 0.3,
        spanGaps: true
      };
    });

    // Add warning threshold line
    if (metric.warn) {
      datasets.push({
        label: 'Warning Threshold',
        data: labels.map(() => metric.warn),
        borderColor: '#EF4444',
        borderWidth: 1.5,
        borderDash: [8, 4],
        pointRadius: 0,
        fill: false
      });
    }

    if (batteryTrendChartInstance) batteryTrendChartInstance.destroy();
    batteryTrendChartInstance = new Chart(document.getElementById('batteryTrendChart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Outfit', size: 12 }, usePointStyle: true, pointStyle: 'circle' } },
          tooltip: {
            titleFont: { family: 'JetBrains Mono', size: 11 },
            bodyFont: { family: 'JetBrains Mono', size: 10 },
            callbacks: {
              afterBody: (items) => {
                if (!items.length) return '';
                const idx = items[0].dataIndex;
                const dsIdx = items[0].datasetIndex;
                if (dsIdx >= batteryIds.length) return '';
                const bid = batteryIds[dsIdx];
                const m = batteryGroups[bid][idx];
                if (!m) return '';
                const ts = m['Timestamp'];
                const mt = m['Match Type'];
                const mn = m['Match Number'];
                const parts = [];
                if (ts) try { parts.push(new Date(ts).toLocaleDateString()); } catch(e) {}
                if (mt || mn) parts.push((mt || '') + ' ' + (mn || ''));
                return parts.length ? parts.join(' · ') : '';
              }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: 'Match Sequence', font: { family: 'JetBrains Mono', size: 11 } }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
          y: { title: { display: true, text: metric.label, font: { family: 'JetBrains Mono', size: 11 } }, ticks: { font: { family: 'JetBrains Mono', size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } }
        }
      }
    });
  }

  renderTrendFilters();
  buildTrendChart();
}

// Drop zone events
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const githubFolderSelect = document.getElementById('githubFolderSelect');
const githubMatchSelect = document.getElementById('githubMatchSelect');

dropZone.addEventListener('click', (e) => {
  // Don't open file dialog if clicking on the meta inputs area
  if (e.target.closest('#metaInputs') || e.target.closest('#githubBrowser') || e.target.closest('#githubBrowseBtn')) return;
  fileInput.click();
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
if (githubFolderSelect) {
  githubFolderSelect.addEventListener('change', () => loadGithubMatchesForFolder(githubFolderSelect.value));
}
if (githubMatchSelect) {
  githubMatchSelect.addEventListener('change', () => {
    githubSelectedMatch = githubMatchSelect.value === '' ? null : githubMatches[Number(githubMatchSelect.value)] || null;
    updateGithubMatchMeta();
  });
}

['dragenter', 'dragover'].forEach(evtName => {
  dropZone.addEventListener(evtName, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
});
['dragleave', 'drop'].forEach(evtName => {
  dropZone.addEventListener(evtName, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
});
dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

// Also allow dropping anywhere on the page
document.body.addEventListener('dragover', (e) => e.preventDefault());
document.body.addEventListener('drop', (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

let timelineNeedsRender = false;
let powerNeedsRender = false;

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    // Render timeline on first visit
    if (btn.dataset.tab === 'timeline') {
      if (timelineNeedsRender && parsedLog && parsedEvents) {
        setTimeout(() => { renderTimeline(parsedLog, parsedEvents); timelineNeedsRender = false; }, 50);
      } else if (chartInstance) {
        setTimeout(() => { chartInstance.resize(); if (modeChartInstance) modeChartInstance.resize(); }, 50);
      }
    }
    // Load match history on first visit
    if (btn.dataset.tab === 'history') {
      loadMatchHistory();
    }
    // Render power chart on first visit
    if (btn.dataset.tab === 'power') {
      if (powerNeedsRender && parsedLog) {
        setTimeout(() => { renderPower(parsedLog); powerNeedsRender = false; }, 50);
      } else if (powerChartInstance) {
        setTimeout(() => { powerChartInstance.resize(); }, 50);
      }
    }
  });
});

function resetDashboard() {
  loadedFiles = {};
  githubSelectedMatch = null;
  pendingLogBuffers = null;
  parsedLog = null;
  parsedEvents = null;
  timelineNeedsRender = false;
  document.getElementById('dropContainer').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('matchBadge').style.display = 'none';
  document.getElementById('batteryBadge').style.display = 'none';
  document.getElementById('eventBadge').style.display = 'none';
  document.getElementById('saveStatus').style.display = 'none';
  document.getElementById('loadNewBtn').style.display = 'none';
  document.getElementById('metaInputs').style.display = 'none';
  document.getElementById('githubBrowser').style.display = 'none';
  const hintEl = document.querySelector('.drop-zone .hint');
  if (hintEl) hintEl.style.display = 'block';
  document.querySelector('.drop-zone p').innerHTML = 'Drag & drop your <strong>.dslog</strong> and <strong>.dsevents</strong> files<br>or click to browse';
  document.querySelector('.drop-zone h2').textContent = 'Drop Robot Logs Here';
  setGithubStatus('');
  updateGithubMatchMeta();
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (modeChartInstance) { modeChartInstance.destroy(); modeChartInstance = null; }
  if (powerChartInstance) { powerChartInstance.destroy(); powerChartInstance = null; }
  if (window._powerModeChartInstance) { window._powerModeChartInstance.destroy(); window._powerModeChartInstance = null; }
  if (batteryTrendChartInstance) { batteryTrendChartInstance.destroy(); batteryTrendChartInstance = null; }
  const trendContainer = document.getElementById('batteryTrendContainer');
  if (trendContainer) trendContainer.style.display = 'none';
}
</script>
