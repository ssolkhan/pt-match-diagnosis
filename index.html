  });
}

function renderSummary(logData, eventData) {
  const records = logData.records;
  const metrics = summarizeMatchMetrics(records, eventData);
  const {
    matchRecs, autoRecs, teleopRecs, minV, avgV, maxV, maxLoss, avgLoss, maxCan,
    brownouts, critErrors, warnings, canTimeouts, canStale, avgCpu, maxCpu,
    penalties, health
  } = metrics;

  const healthColor = health >= 75 ? 'var(--green)' : health >= 50 ? 'var(--yellow)' : 'var(--red)';
  const healthLabel = health >= 75 ? 'Good Match' : health >= 50 ? 'Issues Detected' : 'Severe Match Health Issues';
  const healthCompanion = (critErrors > 0 || warnings > 0)
    ? `<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;">${critErrors} critical error${critErrors === 1 ? '' : 's'}, ${warnings} warning${warnings === 1 ? '' : 's'}</div>`
    : '';

  const penaltyHTML = penalties.length > 0
    ? `<details style="margin-top:10px;"><summary style="font-size:11px;color:var(--text-muted);cursor:pointer;font-family:'JetBrains Mono',monospace;user-select:none;">▸ Score breakdown (${penalties.length} penalties)</summary><div style="margin-top:6px;font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;line-height:1.6;padding-left:4px;">${penalties.map(p => '• ' + p).join('<br>')}</div></details>`
    : '';

  document.getElementById('healthSection').innerHTML = `
    <div style="font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;">Match Health Score</div>
    <div class="health-bar-container">
      <div class="health-score-num" style="color:${healthColor}">${health}</div>
      <div class="health-bar-track">
        <div class="health-bar-fill" style="width:${health}%;background:${healthColor};"></div>
      </div>
      <div class="health-label" style="color:${healthColor}">${healthLabel}</div>
    </div>
    ${healthCompanion}
    ${penaltyHTML}
  `;

  // Mode bar (unchanged logic)
  const totalRecs = records.length;
  const phases = [];
  let curPhase = { mode: 'disconnected', count: 0 };
  const blockSize = 50;
  for (let b = 0; b < Math.ceil(totalRecs / blockSize); b++) {
    const blockStart = b * blockSize;
    const blockEnd = Math.min((b + 1) * blockSize, totalRecs);
    const blockRecs = records.slice(blockStart, blockEnd);
    const modeCounts = {};
    blockRecs.forEach(r => { modeCounts[r.mode] = (modeCounts[r.mode] || 0) + 1; });
    let dominant = Object.entries(modeCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'disconnected';
    if (dominant === curPhase.mode) { curPhase.count++; }
    else { if (curPhase.count > 0) phases.push({ ...curPhase }); curPhase = { mode: dominant, count: 1 }; }
  }
  if (curPhase.count > 0) phases.push(curPhase);

  const totalBlocks = phases.reduce((s, p) => s + p.count, 0);
  const modeNames = { auto: 'Auto', teleop: 'Teleop', disabled: 'Disabled', disconnected: 'Disconnected' };
  const modeBarHTML = phases.map(p => {
    const pct = (p.count / totalBlocks * 100);
    const dur = (p.count).toFixed(0);
    const label = pct > 12 ? `${modeNames[p.mode] || p.mode} (${dur}s)` : pct > 5 ? `${dur}s` : '';
    return `<div class="segment ${p.mode}" style="width:${pct}%">${label}</div>`;
  }).join('');

  document.getElementById('modeBarSection').innerHTML = `
    <h3>Match Mode Timeline</h3>
    <div class="mode-bar">${modeBarHTML}</div>
    <div class="mode-legend">
      <span><div class="dot" style="background:var(--auto-color)"></div> Auto</span>
      <span><div class="dot" style="background:var(--teleop-color)"></div> Teleop</span>
      <span><div class="dot" style="background:var(--disabled-color)"></div> Disabled</span>
      <span><div class="dot" style="background:#E5E7EB"></div> Disconnected</span>
    </div>
  `;

  // Stat cards — now includes CAN timeouts and stale
  const vClass = minV < 10 ? 'danger' : minV < 11 ? 'warning' : 'good';
  const lossClass = maxLoss > 0.05 ? 'warning' : 'good';
  const canClass = maxCan > 0.7 ? 'warning' : 'good';
  const canTimeoutClass = canTimeouts.length > 0 ? 'danger' : 'good';
  const canStaleClass = canStale.length > 10 ? 'danger' : canStale.length > 0 ? 'warning' : 'good';

  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card ${vClass}">
      <div class="label">Min Voltage</div>
      <div class="value">${minV > 0 ? minV.toFixed(1) + 'V' : 'N/A'}</div>
      <div class="sub">Avg ${avgV.toFixed(1)}V · Max ${maxV.toFixed(1)}V</div>
    </div>
    <div class="stat-card ${lossClass}">
      <div class="label">Peak Packet Loss</div>
      <div class="value">${(maxLoss * 100).toFixed(1)}%</div>
      <div class="sub">Avg ${(avgLoss * 100).toFixed(1)}% during match</div>
    </div>
    <div class="stat-card ${canClass}">
      <div class="label">Peak CAN Usage</div>
      <div class="value">${(maxCan * 100).toFixed(0)}%</div>
      <div class="sub">&gt;70% = congestion risk</div>
    </div>
    <div class="stat-card ${canTimeoutClass}">
      <div class="label">CAN Timeouts</div>
      <div class="value">${canTimeouts.length}</div>
      <div class="sub">${canTimeouts.length > 0 ? 'Devices not responding!' : 'All devices OK'}</div>
    </div>
    <div class="stat-card ${canStaleClass}">
      <div class="label">CAN Stale Data</div>
      <div class="value">${canStale.length}</div>
      <div class="sub">${canStale.length > 0 ? 'Intermittent CAN failures' : 'No stale data'}</div>
    </div>
    <div class="stat-card info">
      <div class="label">Auto Duration</div>
      <div class="value">${(autoRecs.length * 0.02).toFixed(1)}s</div>
      <div class="sub">Expected: 15s</div>
    </div>
    <div class="stat-card info">
      <div class="label">Teleop Duration</div>
      <div class="value">${(teleopRecs.length * 0.02).toFixed(1)}s</div>
      <div class="sub">Expected: ~135s</div>
    </div>
    <div class="stat-card ${brownouts > 0 ? 'danger' : 'good'}">
      <div class="label">Brownouts</div>
      <div class="value">${brownouts}</div>
      <div class="sub">${brownouts > 0 ? 'Motor outputs disabled!' : 'None detected'}</div>
    </div>
    <div class="stat-card ${critErrors > 0 ? 'danger' : 'good'}">
      <div class="label">Critical Errors</div>
      <div class="value">${critErrors}</div>
      <div class="sub">${warnings} warnings</div>
    </div>
    <div class="stat-card info">
      <div class="label">Total Events</div>
      <div class="value">${eventData.events.length}</div>
      <div class="sub">${logData.records.length.toLocaleString()} log records</div>
    </div>
  `;

  // ==================== MOTOR ANOMALY DETECTION ====================
  computeMotorAnomalies(matchRecs);
  renderMotorAnomalySummary();
  renderCanSummaryBanner(eventData.events, 'summaryAlerts', 'summaryCan');
}

let motorAnomalies = [];

function computeMotorAnomalies(matchRecs) {
  motorAnomalies = [];
  if (!matchRecs || matchRecs.length === 0) return;
  const hasPDH = matchRecs.some(r => r.pdpChannels && r.pdpChannels.length >= 24 && r.pdpChannels.slice(16).some(v => v > 0));
  const numChannels = hasPDH ? 24 : 16;
  const stats = [];
  for (let ch = 0; ch < numChannels; ch++) {
    const values = matchRecs.map(r => r.pdpChannels ? r.pdpChannels[ch] : 0).filter(v => v > 0);
    const peak = values.length ? Math.max(...values) : 0;
    const avg = values.length ? values.reduce((s,v) => s+v, 0) / values.length : 0;
    stats.push({ ch, peak, avg, hasData: peak > 0.5 });
  }
  const motorChannels = stats.filter(c => c.hasData && !['Sensors','Power','Unused'].includes(pdhGroup(c.ch)));
  if (motorChannels.length < 2) return;
  const functionalGroups = {};
  motorChannels.forEach(c => {
    const role = pdhName(c.ch).replace(/\s+(RF|LF|BL|BR|1|2|3|4)$/i, '').trim();
    if (!functionalGroups[role]) functionalGroups[role] = [];
    functionalGroups[role].push(c);
  });
  Object.entries(functionalGroups).forEach(([role, channels]) => {
    if (channels.length < 2) return;
    const groupAvg = channels.reduce((s,c) => s + c.avg, 0) / channels.length;
    const groupPeakAvg = channels.reduce((s,c) => s + c.peak, 0) / channels.length;
    if (groupAvg < 0.5) return;
    channels.forEach(c => {
      const avgRatio = groupAvg > 0 ? c.avg / groupAvg : 0;
      const peakRatio = groupPeakAvg > 0 ? c.peak / groupPeakAvg : 0;
      if (avgRatio > 2.0) motorAnomalies.push({ ch: c.ch, type: 'high_avg', severity: avgRatio > 3.0 ? 'danger' : 'warning', title: `${pdhName(c.ch)} drawing ${avgRatio.toFixed(1)}\u00d7 more than other ${role} motors`, detail: `Avg: ${c.avg.toFixed(1)}A vs group avg ${groupAvg.toFixed(1)}A`, ratio: avgRatio });
      if (peakRatio > 2.0 && c.peak > 30) motorAnomalies.push({ ch: c.ch, type: 'high_peak', severity: peakRatio > 3.0 ? 'danger' : 'warning', title: `${pdhName(c.ch)} peak ${peakRatio.toFixed(1)}\u00d7 higher than other ${role} motors`, detail: `Peak: ${c.peak.toFixed(1)}A vs group avg peak ${groupPeakAvg.toFixed(1)}A`, ratio: peakRatio });
      if (avgRatio < 0.3 && groupAvg > 2.0) motorAnomalies.push({ ch: c.ch, type: 'low_avg', severity: 'warning', title: `${pdhName(c.ch)} drawing much less than other ${role} motors`, detail: `Avg: ${c.avg.toFixed(1)}A vs group avg ${groupAvg.toFixed(1)}A \u2014 motor may not be working`, ratio: avgRatio });
    });
  });
  motorChannels.forEach(c => {
    if (c.peak > 60) motorAnomalies.push({ ch: c.ch, type: 'breaker_risk', severity: 'danger', title: `${pdhName(c.ch)} peaked at ${c.peak.toFixed(1)}A \u2014 breaker trip risk`, detail: `40A breaker trips at sustained >60A. Check for mechanism binding or stall.`, ratio: c.peak / 40 });
  });
  motorAnomalies.sort((a,b) => (a.severity === 'danger' ? 0 : 1) - (b.severity === 'danger' ? 0 : 1) || b.ratio - a.ratio);
}

function renderMotorAnomalySummary() {
  const container = document.getElementById('summaryMotorAnomalies');
  if (motorAnomalies.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${motorAnomalies.map(a => {
        const color = a.severity === 'danger' ? 'var(--red)' : 'var(--yellow)';
        const bg = a.severity === 'danger' ? 'var(--red-bg)' : 'var(--yellow-bg)';
        const border = a.severity === 'danger' ? 'var(--red-border)' : 'var(--yellow-border)';
        const icon = a.type === 'low_avg' ? '\ud83d\udcc9' : a.type === 'breaker_risk' ? '\ud83d\udd0c' : '\ud83d\udcc8';
        return `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:${bg};border:1px solid ${border};border-left:4px solid ${color};border-radius:var(--radius);">
            <span style="font-size:18px;">${icon}</span>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:600;color:${color};">${a.title}</div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;font-family:'JetBrains Mono',monospace;">${a.detail}</div>
            </div>
            <button class="chart-toggle" style="font-size:10px;padding:3px 8px;border-color:${color};color:${color};white-space:nowrap;" onclick="isolatePowerChannel(${a.ch})">Isolate on Chart</button>
          </div>`;
      }).join('')}
    </div>
  `;
}

function renderTimeline(logData, eventData) {
  // Downsample records for chart performance (target ~2000 points) while
  // preserving brief extremes that would otherwise disappear from the graph.
  const records = logData.records;
  const step = Math.max(1, Math.floor(records.length / 2000));
  const sampled = [];
  if (step === 1) {
    sampled.push(...records);
  } else {
    for (let i = 0; i < records.length; i += step) {
      const window = records.slice(i, Math.min(i + step, records.length));
      if (!window.length) continue;
      const first = window[0];
      const minVoltageRecord = window.reduce((best, r) => {
        if (r.voltage === null) return best;
        if (!best || best.voltage === null || r.voltage < best.voltage) return r;
        return best;
      }, null);
      const maxRiskRecord = window.reduce((best, r) => {
        const score = Math.max(
          r.packetLoss !== null ? r.packetLoss * 100 : -1,
          r.canUsage !== null ? r.canUsage * 100 : -1,
          r.rioCpu * 100,
          r.tripTime
        );
        if (!best || score > best.score) return { record: r, score };
        return best;
      }, null);
      const unique = [];
      [first, minVoltageRecord, maxRiskRecord?.record, window[window.length - 1]].forEach(r => {
        if (r && !unique.includes(r)) unique.push(r);
      });
      sampled.push(...unique);
    }
  }

  // ---- Compute match phase boundaries ----
  const firstAuto = sampled.find(r => r.mode === 'auto');
  const firstTeleop = sampled.find(r => r.mode === 'teleop');
  const lastAuto = [...sampled].reverse().find(r => r.mode === 'auto');
  const lastTeleop = [...sampled].reverse().find(r => r.mode === 'teleop');
  const firstEnabled = firstAuto || firstTeleop;
  const lastEnabled = lastTeleop || lastAuto;

  const matchStart = firstEnabled ? Math.max(0, firstEnabled.time_s - 5) : 0;
  const matchEnd = lastEnabled ? lastEnabled.time_s + 5 : sampled[sampled.length - 1]?.time_s || 0;
  const autoStart = firstAuto ? Math.max(0, firstAuto.time_s - 2) : null;
  const autoEnd = lastAuto ? lastAuto.time_s + 2 : null;
  const teleopStart = firstTeleop ? Math.max(0, firstTeleop.time_s - 2) : null;
  const teleopEnd = lastTeleop ? lastTeleop.time_s + 2 : null;
  const hasMatchData = firstEnabled !== undefined;

  // Store boundaries globally for power chart reuse
  window._matchBounds = {
    matchStart,
    matchEnd,
    autoStart,
    autoEnd,
    teleopStart,
    teleopEnd,
    enabledStart: firstEnabled ? firstEnabled.time_s : null,
    enabledEnd: lastEnabled ? lastEnabled.time_s : null,
    hasMatchData
  };

  // Controls: series toggles + zoom presets
  const controlsSeries = ['Voltage', 'Packet Loss', 'CAN Usage', 'roboRIO CPU', 'Trip Time'];
  const active = { 'Voltage': true, 'Packet Loss': true, 'CAN Usage': false, 'roboRIO CPU': false, 'Trip Time': false };
  
  const zoomPresets = [];
  if (hasMatchData) zoomPresets.push({ id: 'match', label: '▶ Match Only', start: matchStart, end: matchEnd, active: true });
  if (autoStart !== null) zoomPresets.push({ id: 'auto', label: '🔵 Auto', start: autoStart, end: autoEnd });
  if (teleopStart !== null) zoomPresets.push({ id: 'teleop', label: '🟢 Teleop', start: teleopStart, end: teleopEnd });
  zoomPresets.push({ id: 'full', label: '📏 Full Log', start: null, end: null, active: !hasMatchData });

  document.getElementById('chartControls').innerHTML =
    controlsSeries.map(c =>
      `<button class="chart-toggle ${active[c] ? 'active' : ''}" data-series="${c}">${c}</button>`
    ).join('') +
    '<span style="width:1px;height:24px;background:var(--border);margin:0 6px;"></span>' +
    zoomPresets.map(z =>
      `<button class="chart-toggle zoom-preset ${z.active ? 'active' : ''}" data-zoom="${z.id}" data-start="${z.start}" data-end="${z.end}">${z.label}</button>`
    ).join('') +
    '<button class="chart-toggle" id="fullscreenBtn" style="margin-left:auto;" onclick="toggleChartFullscreen()">⛶ Fullscreen</button>';

  // Bind series toggles
  document.querySelectorAll('#chartControls .chart-toggle[data-series]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      updateChart();
    });
  });

  // Bind zoom presets
  document.querySelectorAll('#chartControls .zoom-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#chartControls .zoom-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const start = btn.dataset.start === 'null' ? undefined : parseFloat(btn.dataset.start);
      const end = btn.dataset.end === 'null' ? undefined : parseFloat(btn.dataset.end);
      applyTimelineZoom(start, end);
      // Remove any seek-generated reset button
      const resetBtn = document.getElementById('resetZoomBtn');
      if (resetBtn) resetBtn.remove();
    });
  });

  function applyTimelineZoom(start, end) {
    if (!chartInstance) return;
    if (start !== undefined && end !== undefined) {
      chartInstance.options.scales.x.min = start;
      chartInstance.options.scales.x.max = end;
    } else {
      delete chartInstance.options.scales.x.min;
      delete chartInstance.options.scales.x.max;
    }
    chartInstance.update();
    // Sync mode chart
    if (modeChartInstance) {
      // Mode chart stays category — find nearest label indices
      const mLabels = modeChartInstance.data.labels;
      if (start !== undefined && end !== undefined) {
        let minL = mLabels[0], maxL = mLabels[mLabels.length - 1];
        for (const l of mLabels) { if (parseFloat(l) >= start) { minL = l; break; } }
        for (let i = mLabels.length - 1; i >= 0; i--) { if (parseFloat(mLabels[i]) <= end) { maxL = mLabels[i]; break; } }
        modeChartInstance.options.scales.x.min = minL;
        modeChartInstance.options.scales.x.max = maxL;
      } else {
        delete modeChartInstance.options.scales.x.min;
        delete modeChartInstance.options.scales.x.max;
      }
      modeChartInstance.update();
    }
  }

  function getActiveSeries() {
    return Array.from(document.querySelectorAll('#chartControls .chart-toggle.active[data-series]')).map(b => b.dataset.series);
  }

  const colors = {
    'Voltage': { line: '#C41E1E', bg: 'rgba(196,30,30,0.08)' },
    'Packet Loss': { line: '#B8860B', bg: 'rgba(184,134,11,0.08)' },
    'CAN Usage': { line: '#1E5FC4', bg: 'rgba(30,95,196,0.08)' },
    'roboRIO CPU': { line: '#7C3AED', bg: 'rgba(124,58,237,0.08)' },
    'Trip Time': { line: '#059669', bg: 'rgba(5,150,105,0.08)' }
  };

  const getDataForSeries = (name) => {
    return sampled.map(r => {
      let y;
      switch (name) {
        case 'Voltage': y = r.voltage; break;
        case 'Packet Loss': y = r.packetLoss !== null ? r.packetLoss * 100 : null; break;
        case 'CAN Usage': y = r.canUsage !== null ? r.canUsage * 100 : null; break;
        case 'roboRIO CPU': y = r.rioCpu * 100; break;
        case 'Trip Time': y = r.tripTime; break;
        default: y = null;
      }
      return { x: r.time_s, y };
    });
  };

  // Mode background plugin — uses xScale pixel conversion for linear axis
  const modeBgPlugin = {
    id: 'modeBackground',
    beforeDraw(chart) {
      const ctx = chart.ctx;
      const xScale = chart.scales.x;
      const yScale = chart.scales.yVoltage || chart.scales.yPercent;
      if (!xScale || !yScale) return;

      let prevMode = sampled[0]?.mode;
      let bandStartTime = sampled[0]?.time_s ?? 0;
      for (let i = 1; i <= sampled.length; i++) {
        const mode = i < sampled.length ? sampled[i].mode : null;
        if (mode !== prevMode || i === sampled.length) {
          const endTime = i < sampled.length ? sampled[i].time_s : sampled[sampled.length - 1].time_s;
          const x1 = xScale.getPixelForValue(bandStartTime);
          const x2 = xScale.getPixelForValue(endTime);
          let color = 'rgba(229,231,235,0.25)';
          if (prevMode === 'auto') color = 'rgba(59,130,246,0.12)';
          else if (prevMode === 'teleop') color = 'rgba(34,197,94,0.10)';
          else if (prevMode === 'disabled') color = 'rgba(156,163,175,0.10)';
          
          ctx.fillStyle = color;
          ctx.fillRect(x1, yScale.top, x2 - x1, yScale.bottom - yScale.top);
          
          prevMode = mode;
          bandStartTime = endTime;
        }
      }
    }
  };

  function buildChart() {
    const activeSeries = getActiveSeries();
    const datasets = activeSeries.map(name => ({
      label: name,
      data: getDataForSeries(name),
      borderColor: colors[name].line,
      backgroundColor: colors[name].bg,
      borderWidth: 1.5,
      pointRadius: 0,
      pointHitRadius: 4,
      fill: true,
      tension: 0.2,
      yAxisID: name === 'Voltage' ? 'yVoltage' : 'yPercent',
      spanGaps: true
    }));

    const hasVoltage = activeSeries.includes('Voltage');
    const hasOther = activeSeries.some(s => s !== 'Voltage');

    const scales = {
      x: {
        type: 'linear',
        display: true,
        title: { display: true, text: 'Time (s)', font: { family: 'JetBrains Mono', size: 11 } },
        ticks: { font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 20 }
      }
    };

    // Auto-crop to match window
    if (hasMatchData) {
      scales.x.min = matchStart;
      scales.x.max = matchEnd;
    }
    
    if (hasVoltage) {
      scales.yVoltage = {
        type: 'linear', display: true, position: 'left',
        title: { display: true, text: 'Voltage (V)', font: { family: 'JetBrains Mono', size: 11 } },
        min: 6, max: 14,
        ticks: { font: { family: 'JetBrains Mono', size: 10 } },
        grid: { color: 'rgba(0,0,0,0.05)' }
      };
    }
    if (hasOther) {
      scales.yPercent = {
        type: 'linear', display: true, position: hasVoltage ? 'right' : 'left',
        title: { display: true, text: 'CPU / CAN / Loss / Trip (%)', font: { family: 'JetBrains Mono', size: 11 } },
        min: 0, max: 100,
        ticks: { font: { family: 'JetBrains Mono', size: 10 } },
        grid: { drawOnChartArea: !hasVoltage, color: 'rgba(0,0,0,0.05)' }
      };
    }
    // If only voltage and no percentage-based series
    if (hasVoltage && !hasOther) {
        scales.yPercent = { display: false };
    }
    if (!hasVoltage && hasOther) {
        scales.yVoltage = { display: false };
    }

    return { datasets, scales };
  }

  function updateChart() {
    const { datasets, scales } = buildChart();
    if (chartInstance) {
      // Preserve current zoom
      const curMin = chartInstance.options.scales.x.min;
      const curMax = chartInstance.options.scales.x.max;
      chartInstance.data.datasets = datasets;
      chartInstance.options.scales = scales;
      // Restore zoom (overrides buildChart's default auto-crop)
      if (curMin !== undefined) chartInstance.options.scales.x.min = curMin;
      if (curMax !== undefined) chartInstance.options.scales.x.max = curMax;
      chartInstance.update();
    }
  }

  const { datasets, scales } = buildChart();
  
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('timelineChart'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { bottom: hasMatchData ? 48 : 12 } },
      interaction: { mode: 'index', intersect: false },
      onHover: (event, elements) => {
        if (elements.length > 0 && parsedEvents) {
          const idx = elements[0].index;
          const t = sampled[idx].time_s;
          // Auto-scroll error list if errors tab has been rendered
          const errorItems = document.querySelectorAll('.error-item');
          let closestItem = null;
          let closestDist = Infinity;
          errorItems.forEach(item => {
            const timeEl = item.querySelector('.error-time');
            if (timeEl) {
              const itemTime = parseFloat(timeEl.textContent);
              if (!isNaN(itemTime) && Math.abs(itemTime - t) < closestDist) {
                closestDist = Math.abs(itemTime - t);
                closestItem = item;
              }
            }
          });
          // Highlight closest error
          errorItems.forEach(item => item.classList.remove('highlighted'));
          if (closestItem && closestDist < 5) {
            closestItem.classList.add('highlighted');
          }
        }
      },
      scales,
      plugins: {
        legend: { position: 'top', labels: { font: { family: 'Outfit', size: 12 }, usePointStyle: true, pointStyle: 'line' } },
        tooltip: {
          titleFont: { family: 'JetBrains Mono', size: 12 },
          bodyFont: { family: 'JetBrains Mono', size: 11 },
          footerFont: { family: 'JetBrains Mono', size: 10 },
          footerColor: '#FFD700',
          callbacks: {
            title: (items) => {
              const idx = items[0].dataIndex;
              const r = sampled[idx];
              const matchLabel = getMatchRelativeLabel(r.time_s);
              return `${r.time_s.toFixed(1)}s${matchLabel ? ` • Match ${matchLabel}` : ''} — ${r.mode.toUpperCase()}`;
            },
            footer: (items) => {
              if (!parsedEvents || !items.length) return '';
              const t = sampled[items[0].dataIndex].time_s;
              return getNearbyEventTooltipLines(parsedEvents.events, t);
            }
          }
        },
        matchClockAxis: {
          enabled: hasMatchData,
          bounds: window._matchBounds,
          title: 'Match Time (Auto Start = 0:00)'
        }
      }
    },
    plugins: [modeBgPlugin, matchClockAxisPlugin]
  });

  // Mini mode chart with legend
  const modeLabels = sampled.map(r => r.time_s.toFixed(1));
  const modeValues = sampled.map(r => r.mode === 'auto' ? 3 : r.mode === 'teleop' ? 2 : r.mode === 'disabled' ? 1 : 0);
  const modeColors = sampled.map(r => r.mode === 'auto' ? 'rgba(59,130,246,0.9)' : r.mode === 'teleop' ? 'rgba(34,197,94,0.9)' : r.mode === 'disabled' ? 'rgba(156,163,175,0.6)' : 'rgba(229,231,235,0.5)');

  if (modeChartInstance) modeChartInstance.destroy();
  modeChartInstance = new Chart(document.getElementById('modeChart'), {
    type: 'bar',
    data: {
      labels: modeLabels,
      datasets: [{
        label: 'Robot Mode',
        data: modeValues.map(() => 1),
        backgroundColor: modeColors,
        barPercentage: 1.0,
        categoryPercentage: 1.0,
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const r = sampled[ctx.dataIndex];
              return `${r.time_s.toFixed(1)}s: ${r.mode.toUpperCase()}`;
            }
          }
        }
      },
      scales: {
        x: { display: true, ticks: { display: false }, grid: { display: false },
          title: { display: true, text: 'Robot Mode:   🔵 Auto    🟢 Teleop    ⚫ Disabled    ⬜ Disconnected', font: { family: 'Outfit', size: 12 }, color: '#6B6560' },
          min: hasMatchData ? modeLabels.find(l => parseFloat(l) >= matchStart) : undefined,
          max: hasMatchData ? [...modeLabels].reverse().find(l => parseFloat(l) <= matchEnd) : undefined
        },
        y: { display: false, max: 1 }
      }
    }
  });
}

function renderCanSummaryBanner(events, targetId = 'canSummaryBanner', idPrefix = 'canBanner') {
  const banner = document.getElementById(targetId);
  if (!banner) return;

  // Collect CAN-category events
  const canTimeouts = events.filter(e => e.category === 'CAN' && e.title.includes('Timeout'));
  const canStale = events.filter(e => e.category === 'CAN' && e.title.includes('Stale'));
  const canMismatch = events.filter(e => e.category === 'CAN' && e.title.includes('Mismatch'));
  const canResetParams = events.filter(e => e.category === 'CAN' && e.title.includes('Reset'));

  // Nothing CAN-related? Hide the banner
  if (canTimeouts.length === 0 && canStale.length === 0 && canMismatch.length === 0 && canResetParams.length === 0) {
    banner.innerHTML = '';
    return;
  }

  // Extract device IDs from event text and resolve to mechanism names
  function extractDeviceIds(evts) {
    const ids = new Set();
    evts.forEach(e => {
      const idMatches = e.text.matchAll(/(?:ID[s]?[:\s]+)([\d,\s]+)/gi);
      for (const m of idMatches) {
        m[1].split(/[,\s]+/).filter(s => /^\d+$/.test(s)).forEach(id => ids.add(id));
      }
      const devMatches = e.text.matchAll(/device\s+(\d+)/gi);
      for (const m of devMatches) ids.add(m[1]);
      const msgMatch = e.text.match(/Message\s+(\d+)\s+not found/i);
      if (msgMatch) ids.add(msgMatch[1]);
    });
    return [...ids].sort((a,b) => Number(a) - Number(b));
  }

  function formatCanIds(ids) {
    if (ids.length === 0) return '';
    return ids.map(id => {
      const channels = PDH_BY_CAN_ID[Number(id)];
      const mechName = channels && channels.length > 0 ? channels[0].name : null;
      return mechName
        ? `<strong style="font-family:'JetBrains Mono',monospace;">${id}</strong> <span style="color:var(--text-muted);">(${mechName})</span>`
        : `<strong style="font-family:'JetBrains Mono',monospace;">${id}</strong>`;
    }).join(', ');
  }

  // Compute stale bursts (>3 in 1s window)
  let staleBursts = 0;
  if (canStale.length > 3) {
    for (let i = 0; i < canStale.length - 3; i++) {
      const w = canStale.filter(e => e.time_s >= canStale[i].time_s && e.time_s < canStale[i].time_s + 1.0);
      if (w.length > 3) { staleBursts++; i += w.length - 1; }
    }
  }

  let html = '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">';

  // CAN Timeouts card
  if (canTimeouts.length > 0) {
    const ids = extractDeviceIds(canTimeouts);
    const firstTime = canTimeouts.find(e => e.time_s !== undefined);

    // Group timeouts by device for clean summary
    const timeoutsByDevice = {};
    canTimeouts.forEach(e => {
      const idMatches = [...e.text.matchAll(/IDs?[:\s]+([\d,\s]+)/gi)];
      const devIds = new Set();
      idMatches.forEach(m => m[1].split(/[,\s]+/).filter(s => /^\d+$/.test(s)).forEach(id => devIds.add(id)));
      if (devIds.size === 0) devIds.add('?');
      devIds.forEach(id => {
        if (!timeoutsByDevice[id]) timeoutsByDevice[id] = { count: 0, firstTime: e.time_s, reasons: new Set() };
        timeoutsByDevice[id].count++;
        // Extract the reason after "timed out while waiting for"
        const reasonMatch = e.text.match(/timed out while waiting for\s+([^:<]+)/i);
        if (reasonMatch) timeoutsByDevice[id].reasons.add(reasonMatch[1].trim());
      });
    });

    html += `
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--red-bg);border:1px solid var(--red-border);border-left:5px solid var(--red);border-radius:var(--radius);cursor:pointer;" onclick="document.getElementById('${idPrefix}TimeoutDetail').style.display = document.getElementById('${idPrefix}TimeoutDetail').style.display === 'none' ? 'block' : 'none'">
        <span style="font-size:22px;">🚨</span>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:var(--red);">CAN Timeouts: ${canTimeouts.length} event${canTimeouts.length > 1 ? 's' : ''}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            ${ids.length > 0 ? 'Devices: ' + formatCanIds(ids) : 'Check wiring and device firmware'}
            ${firstTime ? ' · First at <span style="font-family:\'JetBrains Mono\',monospace;">' + firstTime.time_s.toFixed(1) + 's</span>' : ''}
          </div>
        </div>
        ${firstTime ? '<button class="seek-btn" onclick="event.stopPropagation(); seekTimeline(' + (firstTime.time_s || 0) + ')">📈 Seek</button>' : ''}
      </div>
      <div id="${idPrefix}TimeoutDetail" style="display:none;padding:10px 18px 14px 40px;font-size:12px;color:var(--text-secondary);line-height:1.8;background:var(--red-bg);border:1px solid var(--red-border);border-top:none;border-radius:0 0 var(--radius) var(--radius);margin-top:-10px;">
        ${Object.entries(timeoutsByDevice).map(([id, info]) => {
          const channels = PDH_BY_CAN_ID[Number(id)];
          const mechName = channels && channels.length > 0 ? channels[0].name : null;
          const reasons = [...info.reasons].join(', ') || 'CAN timeout';
          return '<div style="margin-bottom:4px;"><strong style="font-family:\'JetBrains Mono\',monospace;">CAN ' + id + (mechName ? ' (' + mechName + ')' : '') + '</strong> — ' + info.count + '× timeout' + (info.count > 1 ? 's' : '') + ' · ' + reasons + '</div>';
        }).join('')}
      </div>`;
  }

  // CAN Stale Data card
  if (canStale.length > 0) {
    const ids = extractDeviceIds(canStale);
    const firstTime = canStale.find(e => e.time_s !== undefined);
    const severity = staleBursts > 0 || canStale.length > 10 ? 'high' : 'low';
    const bgColor = severity === 'high' ? 'var(--red-bg)' : 'var(--yellow-bg)';
    const borderColor = severity === 'high' ? 'var(--red-border)' : 'var(--yellow-border)';
    const accentColor = severity === 'high' ? 'var(--red)' : 'var(--yellow)';
    html += `
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:${bgColor};border:1px solid ${borderColor};border-left:5px solid ${accentColor};border-radius:var(--radius);cursor:pointer;" onclick="document.getElementById('${idPrefix}StaleDetail').style.display = document.getElementById('${idPrefix}StaleDetail').style.display === 'none' ? 'block' : 'none'">
        <span style="font-size:22px;">📡</span>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:${accentColor};">CAN Stale Data: ${canStale.length} event${canStale.length > 1 ? 's' : ''}${staleBursts > 0 ? ' (' + staleBursts + ' burst' + (staleBursts > 1 ? 's' : '') + ')' : ''}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            ${ids.length > 0 ? 'Devices: ' + formatCanIds(ids) : 'Devices intermittently failing to respond'}
            ${firstTime ? ' · First at <span style="font-family:\'JetBrains Mono\',monospace;">' + firstTime.time_s.toFixed(1) + 's</span>' : ''}
          </div>
        </div>
        ${firstTime ? '<button class="seek-btn" onclick="event.stopPropagation(); seekTimeline(' + (firstTime.time_s || 0) + ')">📈 Seek</button>' : ''}
      </div>
      <div id="${idPrefix}StaleDetail" style="display:none;padding:10px 18px 14px 40px;font-size:12px;color:var(--text-secondary);line-height:1.8;background:${bgColor};border:1px solid ${borderColor};border-top:none;border-radius:0 0 var(--radius) var(--radius);margin-top:-10px;">
        ${(() => {
          const staleByDevice = {};
          canStale.forEach(e => {
            const devIds = new Set();
            const idMatches = [...e.text.matchAll(/IDs?[:\s]+([\d,\s]+)/gi)];
            idMatches.forEach(m => m[1].split(/[,\s]+/).filter(s => /^\d+$/.test(s)).forEach(id => devIds.add(id)));
            const msgMatch = e.text.match(/Message\s+(\d+)\s+not found/i);
            if (msgMatch) devIds.add(msgMatch[1]);
            if (devIds.size === 0) devIds.add('?');
            devIds.forEach(id => {
              if (!staleByDevice[id]) staleByDevice[id] = { count: 0 };
              staleByDevice[id].count++;
            });
          });
          return Object.entries(staleByDevice).map(([id, info]) => {
            const channels = PDH_BY_CAN_ID[Number(id)];
            const mechName = channels && channels.length > 0 ? channels[0].name : null;
            return '<div style="margin-bottom:4px;"><strong style="font-family:\'JetBrains Mono\',monospace;">CAN ' + id + (mechName ? ' (' + mechName + ')' : '') + '</strong> — ' + info.count + '× stale event' + (info.count > 1 ? 's' : '') + '</div>';
          }).join('');
        })()}
      </div>`;
  }

  // CAN Device Mismatch card
  if (canMismatch.length > 0) {
    const ids = extractDeviceIds(canMismatch);
    html += `
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--red-bg);border:1px solid var(--red-border);border-left:5px solid var(--red);border-radius:var(--radius);">

function renderErrors(eventData) {
  const events = eventData.events;

  // ---- CAN SUMMARY BANNER ----
  renderCanSummaryBanner(events, 'canSummaryBanner', 'canBanner');

  // ---- MOTOR ANOMALY BANNER ----
  const maBanner = document.getElementById('motorAnomalyBanner');
  if (motorAnomalies.length > 0) {
    maBanner.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        ${motorAnomalies.map(a => {
          const color = a.severity === 'danger' ? 'var(--red)' : 'var(--yellow)';
          const bg = a.severity === 'danger' ? 'var(--red-bg)' : 'var(--yellow-bg)';
          const border = a.severity === 'danger' ? 'var(--red-border)' : 'var(--yellow-border)';
          const icon = a.type === 'low_avg' ? '📉' : a.type === 'breaker_risk' ? '🔌' : '📈';
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:${bg};border:1px solid ${border};border-left:4px solid ${color};border-radius:var(--radius);">
              <span style="font-size:18px;">${icon}</span>
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:600;color:${color};">⚡ ${a.title}</div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;font-family:'JetBrains Mono',monospace;">${a.detail}</div>
              </div>
              <button class="chart-toggle" style="font-size:10px;padding:3px 8px;border-color:${color};color:${color};white-space:nowrap;" onclick="isolatePowerChannel(${a.ch})">Isolate on Chart</button>
            </div>`;
        }).join('')}
      </div>
    `;
  } else {
    maBanner.innerHTML = '';
  }

  // Dedup and group events
  const meaningful = [];
  const seen = new Set();
  for (const e of events) {
    // Dedup by title + first 60 chars
    const key = e.title + '|' + e.text.substring(0, 60);
    if (seen.has(key)) {
      const existing = meaningful.find(m => (m.title + '|' + m.text.substring(0, 60)) === key);
      if (existing) existing.count = (existing.count || 1) + 1;
      continue;
    }
    seen.add(key);
    meaningful.push({ ...e, count: 1 });
  }

  const severityOrder = { critical: 0, warning: 1, info: 2 };
  meaningful.sort((a, b) => severityOrder[a.severity] - severityOrder[b.severity]);

  // Separate noise from actionable
  const actionable = meaningful.filter(e => !e.noise);
  const noiseItems = meaningful.filter(e => e.noise);
  const noiseCount = noiseItems.reduce((s, e) => s + (e.count || 1), 0);

  const critCount = actionable.filter(e => e.severity === 'critical').length;
  const warnCount = actionable.filter(e => e.severity === 'warning').length;
  const infoCount = actionable.filter(e => e.severity === 'info').length;

  let showNoise = false;
  let currentSort = 'severity';
  let currentFilter = 'all';

  function formatEventTime(time_s) {
    if (time_s === undefined || time_s === null) return 'unknown';
    return time_s.toFixed(1) + 's';
  }

  function sortEvents(list, sortType) {
    const sorted = [...list];
    if (sortType === 'severity') sorted.sort((a, b) => severityOrder[a.severity] - severityOrder[b.severity]);
    else if (sortType === 'time-desc') sorted.sort((a, b) => (b.time_s || 0) - (a.time_s || 0));
    else if (sortType === 'time-asc') sorted.sort((a, b) => (a.time_s || 0) - (b.time_s || 0));
    return sorted;
  }

  function renderFilters() {
    const source = showNoise ? meaningful : actionable;
    const crit = source.filter(e => e.severity === 'critical').length;
    const warn = source.filter(e => e.severity === 'warning').length;
    const inf = source.filter(e => e.severity === 'info').length;

    document.getElementById('errorFilters').innerHTML = `
      <button class="filter-chip ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">Actionable <span class="count">${source.length}</span></button>
      <button class="filter-chip ${currentFilter === 'critical' ? 'active' : ''}" data-filter="critical">Critical <span class="count">${crit}</span></button>
      <button class="filter-chip ${currentFilter === 'warning' ? 'active' : ''}" data-filter="warning">Warning <span class="count">${warn}</span></button>
      <button class="filter-chip ${currentFilter === 'info' ? 'active' : ''}" data-filter="info">Info <span class="count">${inf}</span></button>
      <button class="filter-chip ${showNoise ? 'active' : ''}" id="noiseToggle" style="margin-left:8px;border-style:dashed;">
        ${showNoise ? '✓ Showing' : 'Show'} Noise <span class="count">${noiseCount}</span>
      </button>
      <span style="margin-left:auto;display:flex;gap:4px;align-items:center;">
        <span style="font-size:11px;color:var(--text-muted);">Sort:</span>
        <button class="filter-chip ${currentSort === 'severity' ? 'active' : ''}" data-sort="severity">By Severity</button>
        <button class="filter-chip ${currentSort === 'time-desc' ? 'active' : ''}" data-sort="time-desc">Latest First</button>
        <button class="filter-chip ${currentSort === 'time-asc' ? 'active' : ''}" data-sort="time-asc">Earliest First</button>
      </span>
    `;

    // Rebind events
    document.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        currentFilter = chip.dataset.filter;
        renderFilters();
        renderList();
      });
    });
    document.querySelectorAll('.filter-chip[data-sort]').forEach(chip => {
      chip.addEventListener('click', () => {
        currentSort = chip.dataset.sort;
        renderFilters();
        renderList();
      });
    });
    document.getElementById('noiseToggle').addEventListener('click', () => {
      showNoise = !showNoise;
      renderFilters();
      renderList();
    });
  }

  function renderList() {
    const source = showNoise ? meaningful : actionable;
    let filtered = currentFilter === 'all' ? source : source.filter(e => e.severity === currentFilter);
    filtered = sortEvents(filtered, currentSort);
    document.getElementById('errorList').innerHTML = filtered.length === 0
      ? '<div class="no-issues">No events matching this filter.</div>'
      : filtered.map(e => `
        <div class="error-item ${e.severity} ${e.noise ? 'noise-item' : ''}" onclick="this.classList.toggle('expanded')">
          <div class="error-header">
            <span class="severity-badge ${e.severity}">${e.severity}</span>
            <span class="error-title">${escapeHtml(e.title)}</span>
            ${e.count > 1 ? `<span class="error-count">×${e.count}</span>` : ''}
            <span class="error-time" title="Time since log start">${formatEventTime(e.time_s)}</span>
            <button class="seek-btn" onclick="event.stopPropagation(); seekTimeline(${e.time_s || 0})">📈 Seek</button>
          </div>
          <div class="error-detail">${formatErrorDetail(e.text)}</div>
        </div>
      `).join('');
  }

  renderFilters();
  renderList();
}

        <div class="card-evidence">${escapeHtml(d.evidence || '')}</div>
      </div>
    `).join('')}</div>`;
  }

  if (diag.investigate.length > 0) {
    html += `<div class="diag-section-title">🟡 Investigate When Possible</div>`;
    html += `<div class="action-cards">${diag.investigate.map(d => `
      <div class="action-card investigate">
        <div class="card-priority">Investigate ${d.time_s !== undefined ? `<button class="seek-btn" onclick="seekTimeline(${d.time_s})" style="float:right">📈 Show on Timeline</button>` : ''}</div>
        <div class="card-title">${d.title}</div>
        <div class="card-body">${d.body}</div>
        ${d.action ? `<div class="card-body" style="margin-top:10px;font-weight:600;color:var(--yellow);">→ ${d.action}</div>` : ''}
        <div class="card-evidence">${escapeHtml(d.evidence || '')}</div>
      </div>
    `).join('')}</div>`;
  }

  if (diag.monitor.length > 0) {
    html += `<div class="diag-section-title">🟢 Systems Healthy</div>`;
    html += `<div class="action-cards">${diag.monitor.map(d => `
      <div class="action-card monitor">
        <div class="card-priority">OK</div>
        <div class="card-title">${d.title}</div>
        <div class="card-body">${d.body}</div>
        <div class="card-evidence">${escapeHtml(d.evidence || '')}</div>

    `).join('')}</div>`;
  }

  if (diag.fixNow.length === 0 && diag.investigate.length === 0) {
    html += `<div class="no-issues">🎉 No significant issues detected. Great match!</div>`;
  }

  container.innerHTML = html;
  return diag;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function seekTimeline(time_s) {
  // Switch to timeline tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="timeline"]').classList.add('active');
  document.getElementById('tab-timeline').classList.add('active');

  if (timelineNeedsRender && parsedLog && parsedEvents) {
    renderTimeline(parsedLog, parsedEvents);
    timelineNeedsRender = false;
  }

  setTimeout(() => {
    if (!chartInstance) return;

    // Deactivate zoom presets
    document.querySelectorAll('#chartControls .zoom-preset').forEach(b => b.classList.remove('active'));

    // Zoom to ±5s window around the event
    chartInstance.options.scales.x.min = Math.max(0, time_s - 5);
    chartInstance.options.scales.x.max = time_s + 5;
    chartInstance.update();

    // Find closest data point for tooltip
    const ds = chartInstance.data.datasets[0];
    if (ds && ds.data) {
      let closest = 0, minDist = Infinity;
      for (let i = 0; i < ds.data.length; i++) {
        const d = Math.abs((ds.data[i]?.x ?? 0) - time_s);
        if (d < minDist) { minDist = d; closest = i; }
      }
      setTimeout(() => {
        const meta = chartInstance.getDatasetMeta(0);
        if (meta && meta.data[closest]) {
          chartInstance.setActiveElements([{ datasetIndex: 0, index: closest }]);
          chartInstance.tooltip.setActiveElements(
            [{ datasetIndex: 0, index: closest }],
            { x: meta.data[closest].x, y: meta.data[closest].y }
          );
          chartInstance.update('none');
        }
      }, 100);
    }

    // Sync mode chart (category axis — find nearest labels)
    if (modeChartInstance && modeChartInstance.data.labels) {
      const mLabels = modeChartInstance.data.labels;
      let minL = mLabels[0], maxL = mLabels[mLabels.length - 1];
      for (const l of mLabels) { if (parseFloat(l) >= time_s - 5) { minL = l; break; } }
      for (let i = mLabels.length - 1; i >= 0; i--) { if (parseFloat(mLabels[i]) <= time_s + 5) { maxL = mLabels[i]; break; } }
      modeChartInstance.options.scales.x.min = minL;
      modeChartInstance.options.scales.x.max = maxL;
      modeChartInstance.update();
    }

    // Add "Reset Zoom" button
    if (!document.getElementById('resetZoomBtn')) {
      const btn = document.createElement('button');
      btn.id = 'resetZoomBtn';
      btn.className = 'chart-toggle active';
      btn.textContent = '↩ Match View';
      btn.style.marginLeft = '12px';
      btn.onclick = () => {
        const bounds = window._matchBounds;
        if (bounds && bounds.hasMatchData) {
          chartInstance.options.scales.x.min = bounds.matchStart;
          chartInstance.options.scales.x.max = bounds.matchEnd;
        } else {
          delete chartInstance.options.scales.x.min;
          delete chartInstance.options.scales.x.max;
        }
        chartInstance.update();
        // Sync mode chart
        if (modeChartInstance && modeChartInstance.data.labels) {
          const mLabels = modeChartInstance.data.labels;
          if (bounds && bounds.hasMatchData) {
            let minL = mLabels[0], maxL = mLabels[mLabels.length - 1];
            for (const l of mLabels) { if (parseFloat(l) >= bounds.matchStart) { minL = l; break; } }
            for (let i = mLabels.length - 1; i >= 0; i--) { if (parseFloat(mLabels[i]) <= bounds.matchEnd) { maxL = mLabels[i]; break; } }
            modeChartInstance.options.scales.x.min = minL;
            modeChartInstance.options.scales.x.max = maxL;
          } else {
            delete modeChartInstance.options.scales.x.min;
            delete modeChartInstance.options.scales.x.max;
          }
          modeChartInstance.update();
        }
        btn.remove();
        const matchBtn = document.querySelector('#chartControls .zoom-preset[data-zoom="match"]');
        if (matchBtn) matchBtn.classList.add('active');
      };
      document.getElementById('chartControls').appendChild(btn);
    }
  }, 150);
}

let powerChartInstance = null;
let powerActiveChannels = new Set();
let powerSampled = [];

function renderPower(logData) {
  const records = logData.records;
  const matchRecs = records.filter(r => r.mode === 'auto' || r.mode === 'teleop');

  // Determine channel count: 24 for REV PDH, 16 for CTRE PDP
  const hasPDH = records.some(r => r.pdpChannels && r.pdpChannels.length >= 24 && r.pdpChannels.slice(16).some(v => v > 0));
  const numChannels = hasPDH ? 24 : 16;

  // Compute per-channel stats
  const channelStats = [];
  for (let ch = 0; ch < numChannels; ch++) {
    const values = matchRecs.map(r => r.pdpChannels ? r.pdpChannels[ch] : 0).filter(v => v > 0);
    const peak = values.length ? Math.max(...values) : 0;
    const avg = values.length ? values.reduce((s,v) => s+v, 0) / values.length : 0;
    const total = values.reduce((s,v) => s+v, 0) * 0.02; // amp-seconds
    channelStats.push({ ch, peak, avg, total, hasData: peak > 0.5 });
  }

  // Top 3 consumers by peak current
  const sorted = [...channelStats].filter(c => c.hasData).sort((a,b) => b.peak - a.peak);
  const top3 = sorted.slice(0, 3);
  const pdLabel = hasPDH ? 'PDH' : 'PDP';

  // Render motor anomaly alerts at top of Power tab
  const anomalyChSet = new Set(motorAnomalies.map(a => a.ch));
  const paAlerts = document.getElementById('powerAnomalyAlerts');
  if (motorAnomalies.length > 0) {
    paAlerts.innerHTML = `
      <div style="font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">⚠️ Anomaly Channels Detected</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:4px;">
        ${motorAnomalies.map(a => {
          const color = a.severity === 'danger' ? 'var(--red)' : 'var(--yellow)';
          const bg = a.severity === 'danger' ? 'var(--red-bg)' : 'var(--yellow-bg)';
          const border = a.severity === 'danger' ? 'var(--red-border)' : 'var(--yellow-border)';
          const icon = a.type === 'low_avg' ? '📉' : a.type === 'breaker_risk' ? '🔌' : '📈';
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:${bg};border:1px solid ${border};border-left:4px solid ${color};border-radius:var(--radius);">
              <span style="font-size:16px;">${icon}</span>

                <div style="font-size:10px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;">${a.detail}</div>

    document.getElementById('pwrToggleAll')?.addEventListener('click', () => {
      for (let ch = 0; ch < numChannels; ch++) powerActiveChannels.add(ch);
      powerActiveChannels.add(-1);
      renderToggles(); updatePowerChart();
    });
    document.getElementById('pwrToggleNone')?.addEventListener('click', () => {
      powerActiveChannels.clear();
      renderToggles(); updatePowerChart();
    });
    document.getElementById('pwrToggleActive')?.addEventListener('click', () => {
      powerActiveChannels.clear();
      channelStats.filter(c => c.hasData).forEach(c => powerActiveChannels.add(c.ch));
      renderToggles(); updatePowerChart();
    });
    // Group toggles — select all channels in a group
    document.querySelectorAll('#powerChannelToggles .pwr-group-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        powerActiveChannels.clear();
        channelStats.forEach(c => { if (pdhGroup(c.ch) === group) powerActiveChannels.add(c.ch); });
        renderToggles(); updatePowerChart();
      });
    });
  }

  // Zoom controls with presets — compute bounds independently from records
  const pFirstAuto = records.find(r => r.mode === 'auto');
  const pFirstTeleop = records.find(r => r.mode === 'teleop');
  const pLastAuto = [...records].reverse().find(r => r.mode === 'auto');
  const pLastTeleop = [...records].reverse().find(r => r.mode === 'teleop');
  const pFirstEnabled = pFirstAuto || pFirstTeleop;
  const pLastEnabled = pLastTeleop || pLastAuto;
  const pMatchStart = pFirstEnabled ? Math.max(0, pFirstEnabled.time_s - 5) : 0;
  const pMatchEnd = pLastEnabled ? pLastEnabled.time_s + 5 : 0;
  const pAutoStart = pFirstAuto ? Math.max(0, pFirstAuto.time_s - 2) : null;
  const pAutoEnd = pLastAuto ? pLastAuto.time_s + 2 : null;
  const pTeleopStart = pFirstTeleop ? Math.max(0, pFirstTeleop.time_s - 2) : null;
  const pTeleopEnd = pLastTeleop ? pLastTeleop.time_s + 2 : null;
  const pHasMatch = pFirstEnabled !== undefined;

  // Also store globally for timeline if it hasn't computed yet
  if (!window._matchBounds || !window._matchBounds.hasMatchData) {
    window._matchBounds = {
      matchStart: pMatchStart,
      matchEnd: pMatchEnd,
      autoStart: pAutoStart,
      autoEnd: pAutoEnd,
      teleopStart: pTeleopStart,
      teleopEnd: pTeleopEnd,
      enabledStart: pFirstEnabled ? pFirstEnabled.time_s : null,
      enabledEnd: pLastEnabled ? pLastEnabled.time_s : null,
      hasMatchData: pHasMatch
    };
  }

  const pwrZoomPresets = [];
  if (pHasMatch) pwrZoomPresets.push({ id: 'match', label: '▶ Match Only', start: pMatchStart, end: pMatchEnd, active: true });
  if (pAutoStart !== null) pwrZoomPresets.push({ id: 'auto', label: '🔵 Auto', start: pAutoStart, end: pAutoEnd });
  if (pTeleopStart !== null) pwrZoomPresets.push({ id: 'teleop', label: '🟢 Teleop', start: pTeleopStart, end: pTeleopEnd });
  pwrZoomPresets.push({ id: 'full', label: '📏 Full Log', start: null, end: null, active: !pHasMatch });

  document.getElementById('powerChartControls').innerHTML =
    pwrZoomPresets.map(z =>
      `<button class="chart-toggle pwr-zoom-preset ${z.active ? 'active' : ''}" data-start="${z.start}" data-end="${z.end}">${z.label}</button>`
    ).join('') +
    '<button class="chart-toggle" id="pwrFullscreenBtn" style="margin-left:auto;" onclick="togglePowerFullscreen()">⛶ Fullscreen</button>';

  // Downsample with peak preservation — for each window, keep the record with
  // highest total current so brief spikes aren't lost on the chart
  const step = Math.max(1, Math.floor(records.length / 1500));
  powerSampled = [];
  for (let i = 0; i < records.length; i += step) {
    const windowEnd = Math.min(i + step, records.length);
    let bestRec = records[i];
    let maxCurrent = records[i].totalCurrent || 0;
    for (let j = i + 1; j < windowEnd; j++) {
      const tc = records[j].totalCurrent || 0;
      if (tc > maxCurrent) { maxCurrent = tc; bestRec = records[j]; }
    }
    powerSampled.push(bestRec);
  }

  document.querySelectorAll('#powerChartControls .pwr-zoom-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#powerChartControls .pwr-zoom-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const start = btn.dataset.start === 'null' ? undefined : parseFloat(btn.dataset.start);
      const end = btn.dataset.end === 'null' ? undefined : parseFloat(btn.dataset.end);
      if (!powerChartInstance) return;
      if (start !== undefined && end !== undefined) {
        powerChartInstance.options.scales.x.min = start;
        powerChartInstance.options.scales.x.max = end;
      } else {
        delete powerChartInstance.options.scales.x.min;
        delete powerChartInstance.options.scales.x.max;
      }
      powerChartInstance.update();
      // Sync mode bar
      if (window._powerModeChartInstance) {
        const mLabels = window._powerModeChartInstance.data.labels;
        if (start !== undefined && end !== undefined) {
          let minL = mLabels[0], maxL = mLabels[mLabels.length - 1];
          for (const l of mLabels) { if (parseFloat(l) >= start) { minL = l; break; } }
          for (let i = mLabels.length - 1; i >= 0; i--) { if (parseFloat(mLabels[i]) <= end) { maxL = mLabels[i]; break; } }
          window._powerModeChartInstance.options.scales.x.min = minL;
          window._powerModeChartInstance.options.scales.x.max = maxL;
        } else {
          delete window._powerModeChartInstance.options.scales.x.min;
          delete window._powerModeChartInstance.options.scales.x.max;
        }
        window._powerModeChartInstance.update();
      }
      const resetBtn = document.getElementById('pwrResetZoomBtn');
      if (resetBtn) resetBtn.remove();
    });
  });

  function buildPowerDatasets() {
    const datasets = [];
    const activeArr = [...powerActiveChannels].filter(ch => ch >= 0).sort((a,b) => a - b);
    activeArr.forEach(ch => {
      const color = powerSeriesColor(ch);
      datasets.push({
        label: pdhName(ch),
        data: powerSampled.map(r => ({ x: r.time_s, y: r.pdpChannels ? r.pdpChannels[ch] : 0 })),
        backgroundColor: color + '18',
        borderColor: color,
        borderWidth: 2.2,
        fill: false,
        pointRadius: 0,
        tension: 0.2
      });
    });
    // Total current line
    if (powerActiveChannels.has(-1)) {
      datasets.push({
        label: 'Total',
        data: powerSampled.map(r => ({ x: r.time_s, y: r.totalCurrent || 0 })),
        borderColor: '#1A1714',
        borderWidth: 2,
        borderDash: [5, 3],
        fill: false,
        pointRadius: 0,
        tension: 0.2
      });
    }
    return datasets;
  }

  function renderPowerSeriesLegend() {
    const legend = document.getElementById('powerSeriesLegend');
    if (!legend) return;
    const activeArr = [...powerActiveChannels].filter(ch => ch >= 0).sort((a, b) => a - b);
    if (activeArr.length === 0) {
      legend.innerHTML = '';
      return;
    }
    legend.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;">
        ${activeArr.map(ch => {
          const color = powerSeriesColor(ch);
          return `
            <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:11px;font-family:'JetBrains Mono',monospace;">
              <svg width="28" height="10" viewBox="0 0 28 10" aria-hidden="true">
                <line x1="1" y1="5" x2="27" y2="5" stroke="${color}" stroke-width="2.5" stroke-linecap="round"></line>
              </svg>
              <span style="color:${color};font-weight:600;">${pdhName(ch)}</span>
              <span style="color:var(--text-muted);">(${ch})</span>
            </div>`;
        }).join('')}
        ${powerActiveChannels.has(-1) ? `
          <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:11px;font-family:'JetBrains Mono',monospace;">
            <svg width="28" height="10" viewBox="0 0 28 10" aria-hidden="true">
              <line x1="1" y1="5" x2="27" y2="5" stroke="#1A1714" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round"></line>
            </svg>
            <span style="color:#1A1714;font-weight:600;">Total</span>
          </div>` : ''}
      </div>
    `;
  }

  // Mode background plugin for power chart — uses linear xScale
  const powerModeBgPlugin = {
    id: 'powerModeBackground',
    beforeDraw(chart) {
      const ctx = chart.ctx;
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      if (!xScale || !yScale) return;
      let prevMode = powerSampled[0]?.mode;
      let bandStartTime = powerSampled[0]?.time_s ?? 0;
      for (let i = 1; i <= powerSampled.length; i++) {
        const mode = i < powerSampled.length ? powerSampled[i].mode : null;
        if (mode !== prevMode || i === powerSampled.length) {
          const endTime = i < powerSampled.length ? powerSampled[i].time_s : powerSampled[powerSampled.length - 1].time_s;
          const x1 = xScale.getPixelForValue(bandStartTime);
          const x2 = xScale.getPixelForValue(endTime);
          let color = 'rgba(229,231,235,0.25)';
          if (prevMode === 'auto') color = 'rgba(59,130,246,0.12)';
          else if (prevMode === 'teleop') color = 'rgba(34,197,94,0.10)';
          else if (prevMode === 'disabled') color = 'rgba(156,163,175,0.10)';
          ctx.fillStyle = color;
          ctx.fillRect(x1, yScale.top, x2 - x1, yScale.bottom - yScale.top);
          prevMode = mode;
          bandStartTime = endTime;
        }
      }
    }
  };

  function updatePowerChart() {
    const datasets = buildPowerDatasets();
    renderPowerSeriesLegend();
    if (powerChartInstance) {
      // Preserve zoom
      const curMin = powerChartInstance.options.scales.x.min;
      const curMax = powerChartInstance.options.scales.x.max;
      powerChartInstance.data.datasets = datasets;
      if (curMin !== undefined) powerChartInstance.options.scales.x.min = curMin;
      if (curMax !== undefined) powerChartInstance.options.scales.x.max = curMax;
      powerChartInstance.update();
    }
  }

  // Persistent peak annotation plugin — uses downsampled data (peak-preserving)
  const anomalyPeaks = [];
  if (motorAnomalies.length > 0) {
    const datasets = buildPowerDatasets();
    motorAnomalies.forEach(a => {
      const dsIdx = datasets.findIndex(ds => ds.label === pdhName(a.ch));
      if (dsIdx < 0) return;
      let peakIdx = -1, peakVal = 0;
      datasets[dsIdx].data.forEach((pt, i) => {
        if (pt && pt.y > peakVal) { peakVal = pt.y; peakIdx = i; }
      });
      if (peakIdx >= 0) {
        anomalyPeaks.push({ dsIdx, peakIdx, peakVal, time: datasets[dsIdx].data[peakIdx]?.x, name: pdhName(a.ch), color: powerSeriesColor(a.ch), severity: a.severity });
      }
    });
  }

  const powerPeakAnnotationPlugin = {
    id: 'powerPeakAnnotations',
    afterDraw(chart) {
      if (anomalyPeaks.length === 0) return;
      const ctx = chart.ctx;
      ctx.save();
      anomalyPeaks.forEach(peak => {
        const meta = chart.getDatasetMeta(peak.dsIdx);
        if (!meta || !meta.data || !meta.data[peak.peakIdx]) return;
        const pt = meta.data[peak.peakIdx];

        // Dot at peak
        ctx.fillStyle = peak.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Label
        const label = `${peak.name}: ${peak.peakVal.toFixed(1)}A`;
        ctx.font = 'bold 11px "JetBrains Mono", monospace';
        const tw = ctx.measureText(label).width;
        const pad = 4;
        let lx = pt.x - (tw + pad * 2) / 2;
        if (lx + tw + pad * 2 > chart.width - 10) lx = chart.width - tw - pad * 2 - 10;
        if (lx < 10) lx = 10;
        let ly = pt.y - 26;
        if (ly < chart.scales.y.top + 5) ly = pt.y + 10;

        ctx.fillStyle = peak.severity === 'danger' ? '#C41E1E' : '#B8860B';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(lx, ly, tw + pad * 2, 18, 3);
        else ctx.rect(lx, ly, tw + pad * 2, 18);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, lx + pad, ly + 9);
      });
      ctx.restore();
    }
  };

  if (powerChartInstance) powerChartInstance.destroy();
  renderPowerSeriesLegend();
  powerChartInstance = new Chart(document.getElementById('powerChart'), {
    type: 'line',
    data: { datasets: buildPowerDatasets() },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { bottom: pHasMatch ? 48 : 12 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          titleFont: { family: 'JetBrains Mono', size: 11 },
          bodyFont: { family: 'JetBrains Mono', size: 10 },
          footerFont: { family: 'JetBrains Mono', size: 10 },
          footerColor: '#FFD700',
          callbacks: {
            title: (items) => {
              const idx = items[0]?.dataIndex;
              if (idx === undefined) return '';
              const r = powerSampled[idx];
              const matchLabel = getMatchRelativeLabel(r.time_s);
              return `${r.time_s.toFixed(1)}s${matchLabel ? ` • Match ${matchLabel}` : ''} — ${r.mode.toUpperCase()} — Total: ${(r.totalCurrent||0).toFixed(1)}A`;
            },
            footer: (items) => {
              if (!parsedEvents || !items.length) return '';
              const idx = items[0]?.dataIndex;
              if (idx === undefined) return '';
              const t = powerSampled[idx]?.time_s;
              if (t === undefined) return '';
              return getNearbyEventTooltipLines(parsedEvents.events, t);
            }
          }
        },
        matchClockAxis: {
          enabled: pHasMatch,
          bounds: window._matchBounds,
          title: 'Match Time (Auto Start = 0:00)'
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Time (s)', font: { family: 'JetBrains Mono', size: 11 } },
          ticks: { font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 20 },
          min: pHasMatch ? pMatchStart : undefined,
          max: pHasMatch ? pMatchEnd : undefined
        },
        y: { title: { display: true, text: 'Current (A)', font: { family: 'JetBrains Mono', size: 11 } }, min: 0, ticks: { font: { family: 'JetBrains Mono', size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } }
      }
    },
    plugins: [powerModeBgPlugin, powerPeakAnnotationPlugin, matchClockAxisPlugin]
  });

  // Power mode bar chart — synced to power chart zoom
  const pwrModeLabels = powerSampled.map(r => r.time_s.toFixed(1));
  const pwrModeColors = powerSampled.map(r => r.mode === 'auto' ? 'rgba(59,130,246,0.9)' : r.mode === 'teleop' ? 'rgba(34,197,94,0.9)' : r.mode === 'disabled' ? 'rgba(156,163,175,0.6)' : 'rgba(229,231,235,0.5)');

  if (window._powerModeChartInstance) window._powerModeChartInstance.destroy();
  window._powerModeChartInstance = new Chart(document.getElementById('powerModeChart'), {
    type: 'bar',
    data: {
      labels: pwrModeLabels,
      datasets: [{ label: 'Mode', data: pwrModeLabels.map(() => 1), backgroundColor: pwrModeColors, barPercentage: 1.0, categoryPercentage: 1.0, borderWidth: 0 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => { const r = powerSampled[ctx.dataIndex]; return r ? r.time_s.toFixed(1) + 's: ' + r.mode.toUpperCase() : ''; } } } },
      scales: {
        x: { display: true, ticks: { display: false }, grid: { display: false },
          title: { display: true, text: 'Robot Mode:   🔵 Auto    🟢 Teleop    ⚫ Disabled    ⬜ Disconnected', font: { family: 'Outfit', size: 12 }, color: '#6B6560' },
          min: pHasMatch ? pwrModeLabels.find(l => parseFloat(l) >= pMatchStart) : undefined,
          max: pHasMatch ? [...pwrModeLabels].reverse().find(l => parseFloat(l) <= pMatchEnd) : undefined
        },
        y: { display: false, max: 1 }
      }
    }
  });

  // Peak/Avg table for ALL channels with top consumers highlighted
  const topPeakChs = new Set(sorted.slice(0, 3).map(c => c.ch));
  document.getElementById('powerChannelTable').innerHTML = `
    <div style="font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">All Channel Statistics</div>
    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);">
      <table class="history-table" style="min-width:700px;">
        <thead>
          <tr>
            <th style="width:160px;">Mechanism</th>
            <th style="width:50px;">Ch</th>
            <th style="width:50px;">CAN</th>
            <th style="width:70px;">Group</th>
            <th style="width:80px;">Peak (A)</th>
            <th style="width:80px;">Avg (A)</th>
            <th style="width:90px;">Energy (A·s)</th>
            <th style="width:60px;">Status</th>
            <th>Peak Bar</th>
          </tr>
        </thead>
        <tbody>
          ${channelStats.map(c => {
            const isTop = topPeakChs.has(c.ch);
            const isAnomaly = anomalyChSet.has(c.ch);
            const anomalyInfo = motorAnomalies.find(a => a.ch === c.ch);
            const barPct = sorted.length && sorted[0].peak > 0 ? (c.peak / sorted[0].peak * 100) : 0;
            const color = powerSeriesColor(c.ch);
            const cfg = PDH_BY_CHANNEL[c.ch];
            const rowBg = isAnomaly ? (anomalyInfo?.severity === 'danger' ? 'background:var(--red-bg);' : 'background:var(--yellow-bg);') : isTop ? 'background:var(--red-bg);' : '';
            return `
              <tr style="${rowBg}${!c.hasData ? 'opacity:0.4;' : ''}">
                <td style="font-weight:600;color:${color};">${isAnomaly ? '⚠️ ' : ''}${pdhName(c.ch)}</td>
                <td style="color:var(--text-muted);">${c.ch}</td>
                <td style="color:var(--text-muted);">${cfg?.canId ?? '—'}</td>
                <td><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:${color}18;color:${color};font-weight:500;">${pdhGroup(c.ch)}</span></td>
                <td style="${isTop ? 'color:var(--red);font-weight:700;' : ''}">${c.peak.toFixed(1)}</td>
                <td>${c.avg.toFixed(1)}</td>
                <td>${c.total.toFixed(1)}</td>
                <td>${c.hasData ? '<span style="color:var(--green);font-weight:600;">Active</span>' : '<span style="color:var(--text-muted);">Idle</span>'}</td>
                <td>
                  <div style="height:14px;background:var(--surface-alt);border-radius:3px;overflow:hidden;border:1px solid var(--border);">
                    <div style="height:100%;width:${barPct}%;background:${color};border-radius:3px;transition:width 0.5s;"></div>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  renderToggles();
}

// Power chart fullscreen
// Isolate a single channel on the power chart (called from anomaly buttons)
function isolatePowerChannel(ch) {
  // Switch to power tab if not already there
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="power"]').classList.add('active');
  document.getElementById('tab-power').classList.add('active');

  if (powerNeedsRender && parsedLog) {
    renderPower(parsedLog);
    powerNeedsRender = false;
  }

  // Ensure the anomaly channel is visible
  if (!powerActiveChannels.has(ch)) {
    powerActiveChannels.add(ch);
    if (parsedLog) renderPower(parsedLog);
  }

  if (!powerChartInstance) return;

  // Find the target dataset and its peak point
  const targetName = pdhName(ch);
  const targetColor = powerSeriesColor(ch);
  let peakIdx = -1, peakVal = 0, peakTime = 0, targetDsIdx = -1;

  powerChartInstance.data.datasets.forEach((ds, dsIdx) => {
    const isTarget = ds.label === targetName;
    ds.borderWidth = isTarget ? 4 : 0.8;
    ds.backgroundColor = isTarget ? (ds.borderColor + '60') : (ds.borderColor + '10');
    if (isTarget) {
      targetDsIdx = dsIdx;
      ds.data.forEach((pt, i) => {
        if (pt && pt.y > peakVal) { peakVal = pt.y; peakIdx = i; peakTime = pt.x; }
      });
    }
  });

  // Remove any existing peak annotation plugin, then add a new one
  powerChartInstance.config.plugins = (powerChartInstance.config.plugins || []).filter(p => p.id !== 'peakAnnotation');

  if (peakIdx >= 0 && targetDsIdx >= 0) {
    powerChartInstance.config.plugins.push({
      id: 'peakAnnotation',
      afterDraw(chart) {
        const meta = chart.getDatasetMeta(targetDsIdx);
        if (!meta || !meta.data || !meta.data[peakIdx]) return;
        const pt = meta.data[peakIdx];
        const ctx = chart.ctx;

        // Draw vertical dashed line
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = targetColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pt.x, chart.scales.y.top);
        ctx.lineTo(pt.x, chart.scales.y.bottom);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw peak dot
        ctx.fillStyle = targetColor;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw label box
        const label = `⚡ ${targetName}: ${peakVal.toFixed(1)}A peak at ${peakTime?.toFixed(1) ?? '?'}s`;
        ctx.font = 'bold 12px "JetBrains Mono", monospace';
        const textWidth = ctx.measureText(label).width;
        const boxPad = 6;
        const boxW = textWidth + boxPad * 2;
        const boxH = 22;
        // Position above the point, nudge left if near right edge
        let boxX = pt.x - boxW / 2;
        if (boxX + boxW > chart.width - 10) boxX = chart.width - boxW - 10;
        if (boxX < 10) boxX = 10;
        let boxY = pt.y - boxH - 12;
        if (boxY < chart.scales.y.top + 5) boxY = pt.y + 12;

        // Box background
        ctx.fillStyle = targetColor;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(boxX, boxY, boxW, boxH, 4);
        } else {
          ctx.rect(boxX, boxY, boxW, boxH);
        }
        ctx.fill();

        // Arrow from box to point
        ctx.beginPath();
        ctx.moveTo(pt.x - 4, boxY + boxH);
        ctx.lineTo(pt.x, boxY + boxH + 6);
        ctx.lineTo(pt.x + 4, boxY + boxH);
        ctx.fill();

        // Label text
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, boxX + boxPad, boxY + boxH / 2);

        ctx.restore();
      }
    });
  }

  powerChartInstance.update();

  // Scroll to the chart
  document.getElementById('powerChartContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Reset highlight after 8 seconds
  setTimeout(() => {
    if (powerChartInstance) {
      powerChartInstance.data.datasets.forEach(ds => {
        ds.borderWidth = 1.2;
        ds.backgroundColor = ds.borderColor + '40';
      });
      // Remove annotation plugin
      powerChartInstance.config.plugins = (powerChartInstance.config.plugins || []).filter(p => p.id !== 'peakAnnotation');
      powerChartInstance.update();
    }
  }, 8000);
}

// Power chart zoom — reuse the same seek pattern as timeline
function seekPowerChart(time_s) {
  // Switch to power tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="power"]').classList.add('active');
  document.getElementById('tab-power').classList.add('active');

  if (powerNeedsRender && parsedLog) {
    renderPower(parsedLog);
    powerNeedsRender = false;
  }

  setTimeout(() => {
    if (!powerChartInstance) return;

    // Deactivate zoom presets
    document.querySelectorAll('#powerChartControls .pwr-zoom-preset').forEach(b => b.classList.remove('active'));

    powerChartInstance.options.scales.x.min = Math.max(0, time_s - 5);
    powerChartInstance.options.scales.x.max = time_s + 5;
    powerChartInstance.update();

    // Add reset zoom button
    const controls = document.getElementById('powerChartControls');
    if (!document.getElementById('pwrResetZoomBtn')) {
      const btn = document.createElement('button');
      btn.id = 'pwrResetZoomBtn';
      btn.className = 'chart-toggle active';
      btn.textContent = '↩ Match View';
      btn.style.marginRight = '8px';
      btn.onclick = () => {
        const bounds = window._matchBounds;
        if (bounds && bounds.hasMatchData) {
          powerChartInstance.options.scales.x.min = bounds.matchStart;
          powerChartInstance.options.scales.x.max = bounds.matchEnd;
        } else {
          delete powerChartInstance.options.scales.x.min;
          delete powerChartInstance.options.scales.x.max;
        }
        powerChartInstance.update();
        btn.remove();
        const matchBtn = document.querySelector('#powerChartControls .pwr-zoom-preset[data-start]:not([data-start="null"])');
        if (matchBtn) matchBtn.classList.add('active');
      };
      controls.insertBefore(btn, controls.firstChild);
    }
  }, 150);
}

function getGithubEventName() {
  if (!githubSelectedMatch || !githubSelectedMatch.folder) return '';
  const parts = githubSelectedMatch.folder.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : githubSelectedMatch.folder;
}

function setGithubStatus(message, tone = 'muted') {
  const el = document.getElementById('githubStatus');
  if (!el) return;
  el.textContent = message || '';
  el.style.color = tone === 'error' ? 'var(--red)' : tone === 'success' ? 'var(--green)' : tone === 'info' ? 'var(--blue)' : 'var(--text-muted)';
}

function updateGithubMatchMeta() {
  const meta = document.getElementById('githubMatchMeta');
  const analyzeBtn = document.getElementById('githubAnalyzeBtn');
  if (!meta || !analyzeBtn) return;
  if (!githubSelectedMatch) {
    meta.textContent = '';

  }

async function loadGithubFolders() {

  setGithubStatus('Loading GitHub folders...', 'info');

    folderSelect.innerHTML = githubFolders.length
      ? '<option value="">Choose a folder...</option>' + githubFolders.map(f => `<option value="${escapeHtml(f.path)}">${escapeHtml(f.name)} (${f.pairCount})</option>`).join('')

async function loadGithubMatchesForFolder(folder) {
  const matchSelect = document.getElementById('githubMatchSelect');

  matchSelect.innerHTML = '<option value="">Loading matches...</option>';
  setGithubStatus('Loading paired logs...', 'info');
